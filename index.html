<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ぜんのすけのお洋服</title>
  <style>
    :root{
      --bg: linear-gradient(180deg, #fff7fb 0%, #f3f7ff 40%, #f6fff9 100%);
      --card: rgba(255,255,255,.78);
      --text:#1f2937;
      --muted:#6b7280;
      --line: rgba(229,231,235,.85);

      --brandGrad: linear-gradient(135deg, #ff6fb1 0%, #7c87ff 52%, #2dd4bf 110%);
      --danger:#ef4444;

      --shadow: 0 12px 32px rgba(31,41,55,.10);
      --shadowSoft: 0 6px 18px rgba(31,41,55,.08);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(124,135,255,.14) 1px, transparent 1px),
        radial-gradient(rgba(255,111,177,.12) 1px, transparent 1px);
      background-size: 28px 28px, 34px 34px;
      background-position: 0 0, 12px 10px;
      opacity: .35;
      z-index: 0;
    }

    .app{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding-bottom:98px;}
    header{
      position:sticky; top:0; z-index:10;
      background: rgba(255,255,255,.60);
      border-bottom: 1px solid rgba(229,231,235,.70);
      backdrop-filter: blur(12px);
      padding:14px 14px 8px;
    }
    .title{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
    h1{margin:0; font-size:18px; letter-spacing:.03em}
    .sub{color:var(--muted); font-size:12px; margin-top:4px}
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      border: 1px solid rgba(229,231,235,.8);
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadowSoft);
      padding:8px 10px;
      border-radius:999px;
      font-weight:800;
      font-size:12px;
    }

    .content{padding:14px}
    .card{
      background: var(--card);
      border: 1px solid rgba(229,231,235,.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:14px;
    }
    .stack{display:flex; flex-direction:column; gap:12px}
    .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .row .left{display:flex; align-items:center; gap:10px; min-width:0}
    .k{color:var(--muted); font-size:12px; width:92px; flex:0 0 auto}
    .v{min-width:0}
    .v .name{font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .v .meta{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

    .btns{display:flex; gap:10px; margin-top:12px}
    button{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:12px 12px;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
    }
    .btn-primary{background: var(--brandGrad); color:#fff}
    .btn-ghost{
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(229,231,235,.85);
      box-shadow: var(--shadowSoft);
      color: var(--text);
    }
    .btn-danger{
      background: rgba(255,255,255,.78);
      color: var(--danger);
      border:1px solid rgba(239,68,68,.30);
      box-shadow: var(--shadowSoft);
    }
    .btn-small{padding:10px 10px; font-size:13px; border-radius:12px}
    .btn-wide{width:100%}
    button:active{transform:scale(.99)}
    button[disabled]{opacity:.55; cursor:not-allowed}

    .badge{
      font-size:11px; font-weight:900; padding:6px 10px; border-radius:999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(229,231,235,.85);
      box-shadow: 0 4px 12px rgba(31,41,55,.06);
      color: var(--muted);
    }

    .field{display:flex; flex-direction:column; gap:6px}
    label{font-size:12px; color:var(--muted); font-weight:800}
    input, select{
      width:100%;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(229,231,235,.85);
      border-radius:14px;
      padding:12px 12px;
      font-size:14px;
      outline:none;
    }

    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .hint{font-size:12px; color:var(--muted); line-height:1.35}
    .divider{height:1px; background:rgba(229,231,235,.85); margin:12px 0}

    /* wardrobe list */
    .list{display:flex; flex-direction:column; gap:10px}
    .itemRow{
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(229,231,235,.85);
      border-radius: 18px;
      padding:12px;
      box-shadow: var(--shadowSoft);
    }
    .itemTop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
    .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}

    /* wardrobe tabs horizontal */
    .tabs{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:2px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .tab{
      flex:0 0 auto;
      min-width: 120px;
      scroll-snap-align: start;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(229,231,235,.85);
      border-radius: 16px;
      padding:10px 10px;
      font-weight:900;
      font-size:13px;
      box-shadow: var(--shadowSoft);
    }
    .tab.active{
      background: var(--brandGrad);
      border-color: transparent;
      color:#fff;
    }

    /* bottom nav */
    .nav{
      position:fixed; left:0; right:0; bottom:0;
      background: rgba(255,255,255,.70);
      border-top: 1px solid rgba(229,231,235,.75);
      backdrop-filter: blur(14px);
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      z-index:20;
    }
    .navInner{
      max-width:520px;
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
    }
    .nav a{
      text-decoration:none;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding:10px 0;
      border-radius:16px;
      font-weight:900;
      font-size:12px;
    }
    .nav a.active{
      color:var(--text);
      background: rgba(124,135,255,.14);
    }

    .toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:96px;
      background: rgba(17,24,39,.92);
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      box-shadow: var(--shadowSoft);
    }
    .toast.show{opacity:1}

    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div>
          <h1>ぜんのすけのお洋服</h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <div class="pill" id="todayPill">今日</div>
      </div>
    </header>

    <main class="content">
      <section id="view-home" class="stack"></section>
      <section id="view-wardrobe" class="stack" style="display:none"></section>
      <section id="view-history" class="stack" style="display:none"></section>
      <section id="view-favorites" class="stack" style="display:none"></section>
      <section id="view-settings" class="stack" style="display:none"></section>
    </main>
  </div>

  <nav class="nav">
    <div class="navInner">
      <a href="#home" data-nav="home" class="active">ホーム</a>
      <a href="#wardrobe" data-nav="wardrobe">ワードローブ</a>
      <a href="#history" data-nav="history">履歴</a>
      <a href="#favorites" data-nav="favorites">お気に入り</a>
      <a href="#settings" data-nav="settings">設定</a>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

<script>
/* =========================
   localStorage state
   ========================= */
const STORAGE_KEY = "zennosuke_outfit_v5";

/** categories (wardrobe order) : outer -> tops -> bottoms -> tights -> socks -> shoes */
const CATS = [
  { key:"outer",   label:"アウター", icon:"🧥" },
  { key:"tops",    label:"トップス", icon:"👕" },
  { key:"bottoms", label:"ボトムス", icon:"👖" },
  { key:"tights",  label:"タイツ",   icon:"🧦" },
  { key:"socks",   label:"靴下",     icon:"🧦" },
  { key:"shoes",   label:"靴",       icon:"👟" },
];

function uid() {
  return Math.random().toString(16).slice(2) + "-" + Date.now().toString(16);
}
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try { return JSON.parse(raw); } catch(e){}
  }
  return null;
}
function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* migrate from v4 if exists */
function migrateFromV4IfExists(){
  const old = localStorage.getItem("zennosuke_outfit_v4");
  if(!old) return null;
  try{
    const obj = JSON.parse(old);

    // normalize wardrobe
    if(Array.isArray(obj.wardrobe)){
      obj.wardrobe = obj.wardrobe.map(it=>({
        size:"",
        priority: 3,
        enabled: true,
        ...it
      }));
    } else obj.wardrobe = [];

    // IMPORTANT: favorites should survive history clear -> store dedicated favorites list
    // if old had fav in history, extract them
    const favorites = [];
    if(Array.isArray(obj.history)){
      for(const h of obj.history){
        if(h && h.fav){
          favorites.push({
            id: h.id || uid(),
            at: h.at || Date.now(),
            outerId: ("outerId" in h) ? h.outerId : (h.outer_id || null),
            topsId: h.topsId ?? null,
            bottomsId: h.bottomsId ?? null,
            tightsId: ("tightsId" in h) ? h.tightsId : null,
            socksId: ("socksId" in h) ? h.socksId : null,
            shoesId: ("shoesId" in h) ? h.shoesId : null,
          });
        }
      }
    }

    obj.favorites = Array.isArray(obj.favorites) ? obj.favorites : favorites;

    // normalize history
    obj.history = (Array.isArray(obj.history) ? obj.history : []).map(h=>({
      id: h.id || uid(),
      at: h.at || Date.now(),
      outerId: ("outerId" in h) ? h.outerId : null,
      topsId: h.topsId ?? null,
      bottomsId: h.bottomsId ?? null,
      tightsId: ("tightsId" in h) ? h.tightsId : null,
      socksId: ("socksId" in h) ? h.socksId : null,
      shoesId: ("shoesId" in h) ? h.shoesId : null,
    }));

    // ui
    obj.ui = obj.ui || {};
    obj.ui.lock = obj.ui.lock || {};
    if(!("outerId" in obj.ui.lock)) obj.ui.lock.outerId = null;
    if(!("topsId" in obj.ui.lock)) obj.ui.lock.topsId = null;
    if(!("bottomsId" in obj.ui.lock)) obj.ui.lock.bottomsId = null;

    // defaults: tights/socks/shoes none fixed
    // ★修正：null(固定しない) を "none" に上書きしない。未定義のときだけ初期値を入れる
    ["tightsId","socksId","shoesId"].forEach(k=>{
      if(!(k in obj.ui.lock)) obj.ui.lock[k] = "none";
    });

    obj.ui.excluded = obj.ui.excluded || [];
    // wardrobe tab default should start from outer now
    obj.ui.wardrobeTab = obj.ui.wardrobeTab || "outer";

    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    return obj;
  }catch(e){
    return null;
  }
}

function ensureState(){
  let st = loadState();
  if(!st){
    st = migrateFromV4IfExists();
  }
  if(!st){
    st = {
      version: 5,
      wardrobe: seedWardrobe(),
      history: [],
      favorites: [], // ★historyを消しても残す
      ui: {
        lock: {
          outerId:null,
          topsId:null,
          bottomsId:null,
          tightsId:"none",
          socksId:"none",
          shoesId:"none"
        },
        excluded: [],
        wardrobeTab: "outer"
      }
    };
    saveState(st);
  }

  // normalize
  st.wardrobe = Array.isArray(st.wardrobe) ? st.wardrobe.map(it=>({
    size:"", priority:3, enabled:true, ...it
  })) : [];

  st.history = Array.isArray(st.history) ? st.history.map(h=>({
    id: uid(), at: Date.now(),
    outerId:null, topsId:null, bottomsId:null,
    tightsId:null, socksId:null, shoesId:null,
    ...h
  })) : [];

  st.favorites = Array.isArray(st.favorites) ? st.favorites.map(f=>({
    id: uid(), at: Date.now(),
    outerId:null, topsId:null, bottomsId:null,
    tightsId:null, socksId:null, shoesId:null,
    ...f
  })) : [];

  st.ui = st.ui || {};
  st.ui.lock = st.ui.lock || {};
  if(!("outerId" in st.ui.lock)) st.ui.lock.outerId = null;
  if(!("topsId" in st.ui.lock)) st.ui.lock.topsId = null;
  if(!("bottomsId" in st.ui.lock)) st.ui.lock.bottomsId = null;

  // ★修正：null(固定しない) を "none" に上書きしない。未定義のときだけ初期値を入れる
  ["tightsId","socksId","shoesId"].forEach(k=>{
    if(!(k in st.ui.lock)) st.ui.lock[k] = "none";
  });

  if(!("excluded" in st.ui)) st.ui.excluded = [];
  if(!("wardrobeTab" in st.ui)) st.ui.wardrobeTab = "outer";

  saveState(st);
  return st;
}

function seedWardrobe(){
  const items = [
    { category:"tops", name:"ボーダー長袖", color:"navy/white", size:"", priority:4, enabled:true },
    { category:"tops", name:"グレーのトレーナー", color:"gray", size:"", priority:3, enabled:true },
    { category:"tops", name:"白Tシャツ", color:"white", size:"", priority:5, enabled:true },

    { category:"bottoms", name:"デニム", color:"indigo", size:"", priority:4, enabled:true },
    { category:"bottoms", name:"黒のスウェット", color:"black", size:"", priority:5, enabled:true },
    { category:"bottoms", name:"ベージュのチノ", color:"beige", size:"", priority:3, enabled:true },

    { category:"outer", name:"薄手のパーカー", color:"beige", size:"", priority:3, enabled:true },
    { category:"outer", name:"ウィンドブレーカー", color:"navy", size:"", priority:4, enabled:true },
  ].map(x => ({...x, id:uid(), createdAt:Date.now(), updatedAt:Date.now()}));

  return items;
}

/* =========================
   Outfit logic (order: outer -> tops -> bottoms -> tights -> socks -> shoes)
   ========================= */
function catMeta(key){ return (CATS.find(x=>x.key===key)||{label:key, icon:""}); }
function catLabel(key){ const c=catMeta(key); return `${c.icon} ${c.label}`; }

function outfitKey(o){
  return [
    o.outer?.id || "none",
    o.tops?.id || "none",
    o.bottoms?.id || "none",
    o.tights?.id || "none",
    o.socks?.id || "none",
    o.shoes?.id || "none"
  ].join("|");
}

function buildRecentUseMap(history, N=10){
  const m = new Map();
  const recent = history.slice(-N);
  for(const h of recent){
    const ids = [h.outerId, h.topsId, h.bottomsId, h.tightsId, h.socksId, h.shoesId].filter(Boolean);
    for(const id of ids){
      m.set(id, (m.get(id) || 0) + 1);
    }
  }
  return m;
}

function penaltyFor(id, recentMap){
  const c = recentMap.get(id) || 0;
  if(c >= 3) return 0.2;
  if(c >= 1) return 0.6;
  return 1.0;
}

function weightedPick(items, weightFn){
  const ws = items.map(weightFn);
  const total = ws.reduce((a,b)=>a+b,0);
  if(total <= 0) return null;
  let r = Math.random() * total;
  for(let i=0;i<items.length;i++){
    r -= ws[i];
    if(r <= 0) return items[i];
  }
  return items[items.length-1] || null;
}

function generateSuggestions(state, count=3){
  const w = state.wardrobe.filter(x => x.enabled !== false);
  const outers = w.filter(x=>x.category==="outer");
  const tops = w.filter(x=>x.category==="tops");
  const bottoms = w.filter(x=>x.category==="bottoms");
  const tights = w.filter(x=>x.category==="tights");
  const socks = w.filter(x=>x.category==="socks");
  const shoes = w.filter(x=>x.category==="shoes");

  const lock = state.ui.lock || {};

  const lockedTops = lock.topsId ? tops.find(x=>x.id===lock.topsId) : null;
  const lockedBottoms = lock.bottomsId ? bottoms.find(x=>x.id===lock.bottomsId) : null;

  const lockedOuter =
    lock.outerId === "none" ? null :
    (lock.outerId ? (outers.find(x=>x.id===lock.outerId) || null) : undefined);

  const lockedTights =
    lock.tightsId === "none" ? null :
    (lock.tightsId ? (tights.find(x=>x.id===lock.tightsId) || null) : undefined);

  const lockedSocks =
    lock.socksId === "none" ? null :
    (lock.socksId ? (socks.find(x=>x.id===lock.socksId) || null) : undefined);

  const lockedShoes =
    lock.shoesId === "none" ? null :
    (lock.shoesId ? (shoes.find(x=>x.id===lock.shoesId) || null) : undefined);

  if(!lockedTops && tops.length===0) return [];
  if(!lockedBottoms && bottoms.length===0) return [];

  const recentMap = buildRecentUseMap(state.history, 10);
  const excluded = new Set(state.ui.excluded || []);

  const outerPool = [null, ...outers];
  const tightsPool = [null, ...tights];
  const socksPool = [null, ...socks];
  const shoesPool = [null, ...shoes];

  const NONE_WEIGHT = { outer: 0.8, tights: 2.2, socks: 2.0, shoes: 1.8 };

  const seen = new Set();
  const out = [];

  function pickItem(pool){
    return weightedPick(pool, it=>{
      const base = (it.priority || 3) ** 2;
      const p = penaltyFor(it.id, recentMap);
      return base * p;
    });
  }
  function pickOptional(pool, noneWeight){
    return weightedPick(pool, it=>{
      if(it===null) return noneWeight;
      const base = (it.priority || 3) ** 2;
      const p = penaltyFor(it.id, recentMap);
      return base * p;
    });
  }

  for(let tries=0; tries<120 && out.length<count; tries++){
    const t = lockedTops ?? pickItem(tops);
    const b = lockedBottoms ?? pickItem(bottoms);
    if(!t || !b) break;

    const o  = (lockedOuter  === undefined) ? pickOptional(outerPool,  NONE_WEIGHT.outer)  : lockedOuter;
    const ti = (lockedTights === undefined) ? pickOptional(tightsPool, NONE_WEIGHT.tights) : lockedTights;
    const so = (lockedSocks  === undefined) ? pickOptional(socksPool,  NONE_WEIGHT.socks)  : lockedSocks;
    const sh = (lockedShoes  === undefined) ? pickOptional(shoesPool,  NONE_WEIGHT.shoes)  : lockedShoes;

    const outfit = { outer:o, tops:t, bottoms:b, tights:ti, socks:so, shoes:sh };
    const k = outfitKey(outfit);
    if(excluded.has(k)) continue;
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(outfit);
  }
  return out;
}

/* =========================
   UI rendering
   ========================= */
const views = {
  home: document.getElementById("view-home"),
  wardrobe: document.getElementById("view-wardrobe"),
  history: document.getElementById("view-history"),
  favorites: document.getElementById("view-favorites"),
  settings: document.getElementById("view-settings"),
};
const subtitle = document.getElementById("subtitle");
const todayPill = document.getElementById("todayPill");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 1200);
}
function fmtDate(ts){
  return new Date(ts).toLocaleString("ja-JP");
}

function render(){
  const st = ensureState();
  const countItems = st.wardrobe.filter(x => x.enabled !== false).length;
  subtitle.textContent = `お洋服: ${countItems} 点 / 履歴: ${st.history.length} 件 / お気に入り: ${st.favorites.length} 件`;
  todayPill.textContent = `今日 ${new Date().toLocaleDateString("ja-JP")}`;

  const hash = (location.hash || "#home").replace("#","");
  showView(hash);

  renderHome(st);
  renderWardrobe(st);
  renderHistory(st);
  renderFavorites(st);
  renderSettings(st);
}

function showView(name){
  const key = views[name] ? name : "home";
  for(const k of Object.keys(views)){
    views[k].style.display = (k===key) ? "" : "none";
  }
  document.querySelectorAll(".nav a").forEach(a=>{
    a.classList.toggle("active", a.dataset.nav===key);
  });
}

function renderHome(st){
  const root = views.home;
  const suggestions = generateSuggestions(st, 3);
  const lock = st.ui.lock || {};

  root.innerHTML = `
    <div class="card">
      <div class="row">
        <div style="font-weight:900; font-size:16px">今日の提案</div>
        <button class="btn-ghost btn-small" id="btn-resuggest">再提案</button>
      </div>

      <div class="divider"></div>

      <!-- lock controls in same order -->
      <div class="field">
        <label>${catLabel("outer")}</label>
        <select id="lock-outer"></select>
      </div>

      <div class="grid2" style="margin-top:10px">
        <div class="field">
          <label>${catLabel("tops")}</label>
          <select id="lock-tops"></select>
        </div>
        <div class="field">
          <label>${catLabel("bottoms")}</label>
          <select id="lock-bottoms"></select>
        </div>
      </div>

      <div class="grid2" style="margin-top:10px">
        <div class="field">
          <label>${catLabel("tights")}</label>
          <select id="lock-tights"></select>
        </div>
        <div class="field">
          <label>${catLabel("socks")}</label>
          <select id="lock-socks"></select>
        </div>
      </div>

      <div class="field" style="margin-top:10px">
        <label>${catLabel("shoes")}</label>
        <select id="lock-shoes"></select>
      </div>

      <div class="btns">
        <button class="btn-ghost btn-wide" id="btn-clear-excluded" ${(st.ui.excluded||[]).length===0?"disabled":""}>除外クリア</button>
      </div>
    </div>

    <div class="stack" id="suggestion-list"></div>
  `;

  const w = st.wardrobe.filter(x => x.enabled !== false);
  const outers = w.filter(x=>x.category==="outer");
  const tops = w.filter(x=>x.category==="tops");
  const bottoms = w.filter(x=>x.category==="bottoms");
  const tights = w.filter(x=>x.category==="tights");
  const socks = w.filter(x=>x.category==="socks");
  const shoes = w.filter(x=>x.category==="shoes");

  function fillOptional(sel, items, lockValue){
    sel.innerHTML =
      `<option value="">固定しない</option>
       <option value="none">なし（固定）</option>` +
      items.map(it=>`<option value="${it.id}">${escapeHtml(it.name)} (${escapeHtml(it.color)}${it.size? ", "+escapeHtml(it.size):""})</option>`).join("");
    sel.value = (lockValue===null ? "" : lockValue) || "";
  }

  const selO  = root.querySelector("#lock-outer");
  const selT  = root.querySelector("#lock-tops");
  const selB  = root.querySelector("#lock-bottoms");
  const selTi = root.querySelector("#lock-tights");
  const selSo = root.querySelector("#lock-socks");
  const selSh = root.querySelector("#lock-shoes");

  fillOptional(selO, outers, lock.outerId);

  // required
  selT.innerHTML = `<option value="">固定しない</option>` + tops.map(it=>`<option value="${it.id}">${escapeHtml(it.name)} (${escapeHtml(it.color)}${it.size? ", "+escapeHtml(it.size):""})</option>`).join("");
  selB.innerHTML = `<option value="">固定しない</option>` + bottoms.map(it=>`<option value="${it.id}">${escapeHtml(it.name)} (${escapeHtml(it.color)}${it.size? ", "+escapeHtml(it.size):""})</option>`).join("");
  selT.value = lock.topsId || "";
  selB.value = lock.bottomsId || "";

  fillOptional(selTi, tights, lock.tightsId);
  fillOptional(selSo, socks,  lock.socksId);
  fillOptional(selSh, shoes,  lock.shoesId);

  selO.onchange  = () => { st.ui.lock.outerId  = selO.value ? selO.value : null; saveState(st); render(); };
  selT.onchange  = () => { st.ui.lock.topsId   = selT.value || null; saveState(st); render(); };
  selB.onchange  = () => { st.ui.lock.bottomsId= selB.value || null; saveState(st); render(); };
  selTi.onchange = () => { st.ui.lock.tightsId = selTi.value ? selTi.value : null; saveState(st); render(); };
  selSo.onchange = () => { st.ui.lock.socksId  = selSo.value ? selSo.value : null; saveState(st); render(); };
  selSh.onchange = () => { st.ui.lock.shoesId  = selSh.value ? selSh.value : null; saveState(st); render(); };

  root.querySelector("#btn-resuggest").onclick = () => render();
  root.querySelector("#btn-clear-excluded").onclick = () => {
    st.ui.excluded = [];
    saveState(st);
    toast("除外をクリアしました");
    render();
  };

  const list = root.querySelector("#suggestion-list");
  if(suggestions.length===0){
    list.innerHTML = `
      <div class="card">
        <div style="font-weight:900">提案が作れませんでした</div>
      </div>
    `;
    return;
  }

  list.innerHTML = suggestions.map((o, idx)=> {
    const k = outfitKey(o);
    return `
      <div class="card" data-key="${k}">
        <div class="row">
          <div style="font-weight:900; font-size:15px">候補 ${idx+1}</div>
          <span class="badge">OK</span>
        </div>

        <div style="margin-top:10px" class="stack">
          ${renderOutfitRow(catLabel("outer"), o.outer || null)}
          ${renderOutfitRow(catLabel("tops"), o.tops)}
          ${renderOutfitRow(catLabel("bottoms"), o.bottoms)}
          ${renderOutfitRow(catLabel("tights"), o.tights || null)}
          ${renderOutfitRow(catLabel("socks"), o.socks || null)}
          ${renderOutfitRow(catLabel("shoes"), o.shoes || null)}
        </div>

        <div class="btns">
          <button class="btn-primary btn-wide" data-act="adopt">採用</button>
        </div>
        <div class="btns">
          <button class="btn-ghost btn-wide" data-act="exclude">除外して再提案</button>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".card").forEach(card=>{
    const k = card.getAttribute("data-key");
    const adoptBtn = card.querySelector('[data-act="adopt"]');
    const exBtn = card.querySelector('[data-act="exclude"]');

    adoptBtn.onclick = () => {
      const o = suggestions.find(x => outfitKey(x)===k);
      if(!o) return;

      st.history.push({
        id: uid(),
        at: Date.now(),
        outerId: o.outer ? o.outer.id : null,
        topsId: o.tops.id,
        bottomsId: o.bottoms.id,
        tightsId: o.tights ? o.tights.id : null,
        socksId: o.socks ? o.socks.id : null,
        shoesId: o.shoes ? o.shoes.id : null,
      });

      saveState(st);
      toast("採用しました");
      render();
    };

    exBtn.onclick = () => {
      st.ui.excluded = Array.from(new Set([...(st.ui.excluded||[]), k]));
      saveState(st);
      toast("除外しました");
      render();
    };
  });
}

function renderOutfitRow(label, item){
  if(!item){
    return `
      <div class="row">
        <div class="left">
          <div class="k">${label}</div>
          <div class="v">
            <div class="name">なし</div>
            <div class="meta">-</div>
          </div>
        </div>
        <span class="badge">-</span>
      </div>
    `;
  }
  const sizeText = item.size ? ` / size: ${escapeHtml(item.size)}` : "";
  return `
    <div class="row">
      <div class="left">
        <div class="k">${label}</div>
        <div class="v">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="meta">${escapeHtml(item.color)}${sizeText}</div>
        </div>
      </div>
      <span class="badge">OK</span>
    </div>
  `;
}

function renderWardrobe(st){
  const root = views.wardrobe;
  const tab = st.ui.wardrobeTab || "outer";
  const items = st.wardrobe.filter(x=>x.category===tab).sort((a,b)=>a.createdAt-b.createdAt);

  root.innerHTML = `
    <div class="card">
      <div style="font-weight:900; font-size:16px">ワードローブ</div>
      <div style="margin-top:12px" class="tabs" id="wardrobe-tabs"></div>
    </div>

    <div class="card">
      <div style="font-weight:900">追加（${catLabel(tab)}）</div>
      <div style="margin-top:10px" class="stack">
        <div class="field">
          <label>name</label>
          <input id="add-name" placeholder="例：ボーダー長袖" />
        </div>
        <div class="field">
          <label>color</label>
          <input id="add-color" placeholder="例：navy/white" />
        </div>
        <div class="field">
          <label>size</label>
          <input id="add-size" placeholder="例：100 / 100-110 / 15cm" />
        </div>
        <button class="btn-primary btn-wide" id="btn-add">追加</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div style="font-weight:900">一覧（${catLabel(tab)}）</div>
        <span class="badge">${items.length} 点</span>
      </div>
      <div class="divider"></div>
      <div class="list" id="wardrobe-list"></div>
    </div>
  `;

  const tabs = root.querySelector("#wardrobe-tabs");
  tabs.innerHTML = CATS.map(c => `
    <button class="tab ${c.key===tab?"active":""}" data-tab="${c.key}">${c.icon} ${c.label}</button>
  `).join("");
  tabs.querySelectorAll("button").forEach(b=>{
    b.onclick = () => {
      st.ui.wardrobeTab = b.dataset.tab;
      saveState(st); render();
    };
  });

  const addName = root.querySelector("#add-name");
  const addColor = root.querySelector("#add-color");
  const addSize = root.querySelector("#add-size");

  root.querySelector("#btn-add").onclick = () => {
    const name = (addName.value||"").trim();
    const color = (addColor.value||"").trim();
    const size = (addSize.value||"").trim();

    if(!name || !color){ alert("name と color は必須です"); return; }

    const item = {
      id: uid(),
      category: tab,
      name, color, size,
      priority: 3,
      enabled: true,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    st.wardrobe.push(item);
    saveState(st);
    toast("追加しました");
    addName.value=""; addColor.value=""; addSize.value="";
    render();
  };

  const list = root.querySelector("#wardrobe-list");
  if(items.length===0){
    list.innerHTML = `<div class="hint">まだありません</div>`;
    return;
  }

  list.innerHTML = items.map(it => `
    <div class="itemRow" data-id="${it.id}">
      <div class="itemTop">
        <div style="min-width:0">
          <div style="font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${escapeHtml(it.name)}</div>
          <div class="hint">${escapeHtml(it.color)}${it.size ? " / size: "+escapeHtml(it.size) : ""}</div>
        </div>
        <span class="badge">OK</span>
      </div>

      <div class="actions">
        <button class="btn-ghost btn-small" data-act="edit">編集</button>
        <button class="btn-danger btn-small" data-act="grad">卒業</button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll(".itemRow").forEach(row=>{
    const id = row.dataset.id;
    const item = st.wardrobe.find(x=>x.id===id);

    row.querySelector('[data-act="grad"]').onclick = () => {
      if(!confirm("卒業しますか？")) return;
      // unlock if needed
      ["outerId","topsId","bottomsId","tightsId","socksId","shoesId"].forEach(k=>{
        if(st.ui.lock && st.ui.lock[k]===id) st.ui.lock[k]=null;
      });
      st.wardrobe = st.wardrobe.filter(x=>x.id!==id);
      saveState(st);
      toast("卒業しました");
      render();
    };

    row.querySelector('[data-act="edit"]').onclick = () => openEditDialog(st, item);
  });
}

function openEditDialog(st, item){
  const html = `
    <div class="card" style="position:fixed; left:14px; right:14px; top:14px; max-width:520px; margin:0 auto; z-index:50;">
      <div class="row">
        <div style="font-weight:900">編集（${catLabel(item.category)}）</div>
        <button class="btn-ghost btn-small" id="dlg-close">閉じる</button>
      </div>
      <div class="divider"></div>

      <div class="stack">
        <div class="field">
          <label>name</label>
          <input id="e-name" value="${escapeAttr(item.name)}" />
        </div>
        <div class="field">
          <label>color</label>
          <input id="e-color" value="${escapeAttr(item.color)}" />
        </div>
        <div class="field">
          <label>size</label>
          <input id="e-size" value="${escapeAttr(item.size || "")}" placeholder="例：100 / 100-110 / 15cm" />
        </div>

        <button class="btn-primary btn-wide" id="dlg-save">保存</button>
      </div>
    </div>
    <div id="dlg-backdrop" style="position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:40"></div>
  `;

  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap);

  function close(){ wrap.remove(); }
  wrap.querySelector("#dlg-close").onclick = close;
  wrap.querySelector("#dlg-backdrop").onclick = close;

  wrap.querySelector("#dlg-save").onclick = () => {
    const name = wrap.querySelector("#e-name").value.trim();
    const color = wrap.querySelector("#e-color").value.trim();
    const size = wrap.querySelector("#e-size").value.trim();

    if(!name || !color){ alert("name と color は必須です"); return; }

    item.name = name;
    item.color = color;
    item.size = size;
    item.updatedAt = Date.now();

    saveState(st);
    toast("保存しました");
    close();
    render();
  };
}

function renderHistory(st){
  const root = views.history;
  const byId = new Map(st.wardrobe.map(x=>[x.id, x]));
  const rows = [...st.history].slice().reverse().slice(0, 200);

  root.innerHTML = `
    <div class="card">
      <div class="row">
        <div style="font-weight:900; font-size:16px">履歴</div>
        <button class="btn-danger btn-small" id="btn-clear-history" ${st.history.length? "":"disabled"}>全消し</button>
      </div>
    </div>

    <div class="stack" id="hist-list"></div>
  `;

  // clear history BUT keep favorites
  root.querySelector("#btn-clear-history").onclick = () => {
    if(!confirm("履歴を全消ししますか？")) return;
    st.history = [];
    saveState(st);
    toast("履歴を消しました");
    render();
  };

  const list = root.querySelector("#hist-list");
  if(rows.length===0){
    list.innerHTML = `<div class="card"><div style="font-weight:900">まだありません</div></div>`;
    return;
  }

  list.innerHTML = rows.map(h=>{
    const o  = h.outerId ? byId.get(h.outerId) : null;
    const t  = h.topsId ? byId.get(h.topsId) : null;
    const b  = h.bottomsId ? byId.get(h.bottomsId) : null;
    const ti = h.tightsId ? byId.get(h.tightsId) : null;
    const so = h.socksId ? byId.get(h.socksId) : null;
    const sh = h.shoesId ? byId.get(h.shoesId) : null;

    const key = [h.outerId||"none",h.topsId||"none",h.bottomsId||"none",h.tightsId||"none",h.socksId||"none",h.shoesId||"none"].join("|");

    const isFav = st.favorites.some(f => (f.key ? f.key===key : (
      (f.outerId||"none")=== (h.outerId||"none") &&
      (f.topsId||"none")=== (h.topsId||"none") &&
      (f.bottomsId||"none")=== (h.bottomsId||"none") &&
      (f.tightsId||"none")=== (h.tightsId||"none") &&
      (f.socksId||"none")=== (h.socksId||"none") &&
      (f.shoesId||"none")=== (h.shoesId||"none")
    )));
    const star = isFav ? "★" : "☆";

    return `
      <div class="card" data-hid="${h.id}">
        <div class="row">
          <div class="hint">${fmtDate(h.at)}</div>
          <button class="btn-ghost btn-small" data-act="fav" data-key="${escapeAttr(key)}">${star} お気に入り</button>
        </div>
        <div style="margin-top:10px" class="stack">
          ${renderHistoryLine(catLabel("outer"), o, true)}
          ${renderHistoryLine(catLabel("tops"), t, true)}
          ${renderHistoryLine(catLabel("bottoms"), b, true)}
          ${renderHistoryLine(catLabel("tights"), ti, true)}
          ${renderHistoryLine(catLabel("socks"), so, true)}
          ${renderHistoryLine(catLabel("shoes"), sh, true)}
        </div>
      </div>
    `;
  }).join("");

  root.querySelectorAll('[data-act="fav"]').forEach(btn=>{
    btn.onclick = () => {
      const key = btn.getAttribute("data-key");
      const [outerId,topsId,bottomsId,tightsId,socksId,shoesId] = key.split("|").map(x=>x==="none"?null:x);

      const idx = st.favorites.findIndex(f=>{
        const k = [f.outerId||"none",f.topsId||"none",f.bottomsId||"none",f.tightsId||"none",f.socksId||"none",f.shoesId||"none"].join("|");
        return k === key;
      });

      if(idx >= 0){
        st.favorites.splice(idx, 1);
        toast("お気に入り解除");
      }else{
        st.favorites.push({
          id: uid(),
          at: Date.now(),
          outerId, topsId, bottomsId, tightsId, socksId, shoesId
        });
        toast("お気に入りに追加");
      }

      saveState(st);
      render();
    };
  });
}

function renderFavorites(st){
  const root = views.favorites;
  const byId = new Map(st.wardrobe.map(x=>[x.id, x]));
  const favs = [...st.favorites].sort((a,b)=>b.at-a.at).slice(0, 200);

  root.innerHTML = `
    <div class="card">
      <div class="row">
        <div style="font-weight:900; font-size:16px">お気に入り</div>
        <span class="badge">${favs.length} 件</span>
      </div>
    </div>

    <div class="stack" id="fav-list"></div>
  `;

  const list = root.querySelector("#fav-list");
  if(favs.length===0){
    list.innerHTML = `<div class="card"><div style="font-weight:900">まだありません</div></div>`;
    return;
  }

  list.innerHTML = favs.map(f=>{
    const o  = f.outerId ? byId.get(f.outerId) : null;
    const t  = f.topsId ? byId.get(f.topsId) : null;
    const b  = f.bottomsId ? byId.get(f.bottomsId) : null;
    const ti = f.tightsId ? byId.get(f.tightsId) : null;
    const so = f.socksId ? byId.get(f.socksId) : null;
    const sh = f.shoesId ? byId.get(f.shoesId) : null;

    const key = [f.outerId||"none",f.topsId||"none",f.bottomsId||"none",f.tightsId||"none",f.socksId||"none",f.shoesId||"none"].join("|");

    return `
      <div class="card">
        <div class="row">
          <div class="hint">${fmtDate(f.at)}</div>
          <button class="btn-ghost btn-small" data-act="unfav" data-key="${escapeAttr(key)}">★ 解除</button>
        </div>
        <div style="margin-top:10px" class="stack">
          ${renderHistoryLine(catLabel("outer"), o, true)}
          ${renderHistoryLine(catLabel("tops"), t, true)}
          ${renderHistoryLine(catLabel("bottoms"), b, true)}
          ${renderHistoryLine(catLabel("tights"), ti, true)}
          ${renderHistoryLine(catLabel("socks"), so, true)}
          ${renderHistoryLine(catLabel("shoes"), sh, true)}
        </div>
      </div>
    `;
  }).join("");

  root.querySelectorAll('[data-act="unfav"]').forEach(btn=>{
    btn.onclick = () => {
      const key = btn.getAttribute("data-key");
      const idx = st.favorites.findIndex(f=>{
        const k = [f.outerId||"none",f.topsId||"none",f.bottomsId||"none",f.tightsId||"none",f.socksId||"none",f.shoesId||"none"].join("|");
        return k === key;
      });
      if(idx >= 0){
        st.favorites.splice(idx, 1);
        saveState(st);
        toast("お気に入り解除");
        render();
      }
    };
  });
}

function renderHistoryLine(label, item, allowNone=false){
  if(!item){
    return `
      <div class="row">
        <div class="left">
          <div class="k">${label}</div>
          <div class="v">
            <div class="name">${allowNone ? "なし" : "（卒業済み）"}</div>
            <div class="meta">-</div>
          </div>
        </div>
        <span class="badge">-</span>
      </div>
    `;
  }
  return renderOutfitRow(label, item);
}

function renderSettings(st){
  const root = views.settings;
  root.innerHTML = `
    <div class="card">
      <div style="font-weight:900; font-size:16px">設定</div>
    </div>

    <div class="card">
      <div style="font-weight:900">データ管理</div>

      <div class="btns" style="margin-top:10px">
        <button class="btn-ghost btn-wide" id="btn-export">エクスポート（JSON）</button>
      </div>
      <div class="btns">
        <button class="btn-ghost btn-wide" id="btn-import">インポート（JSON）</button>
      </div>
      <div class="btns">
        <button class="btn-danger btn-wide" id="btn-reset">全リセット</button>
      </div>

      <input type="file" id="file" accept="application/json" style="display:none" />
    </div>
  `;

  root.querySelector("#btn-export").onclick = () => {
    const st2 = ensureState();
    const blob = new Blob([JSON.stringify(st2, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `zennosuke_outfit_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("エクスポートしました");
  };

  const file = root.querySelector("#file");
  root.querySelector("#btn-import").onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files && file.files[0];
    if(!f) return;
    try{
      const txt = await f.text();
      const obj = JSON.parse(txt);
      if(!obj || !obj.wardrobe) throw new Error("形式が違います");

      obj.wardrobe = (obj.wardrobe||[]).map(it=>({ size:"", priority:3, enabled:true, ...it }));
      obj.history = (obj.history||[]).map(h=>({
        id: uid(), at: Date.now(),
        outerId:null, topsId:null, bottomsId:null, tightsId:null, socksId:null, shoesId:null,
        ...h
      }));
      obj.favorites = (obj.favorites||[]).map(f=>({
        id: uid(), at: Date.now(),
        outerId:null, topsId:null, bottomsId:null, tightsId:null, socksId:null, shoesId:null,
        ...f
      }));

      obj.ui = obj.ui || {};
      obj.ui.lock = obj.ui.lock || {};
      if(!("outerId" in obj.ui.lock)) obj.ui.lock.outerId = null;
      if(!("topsId" in obj.ui.lock)) obj.ui.lock.topsId = null;
      if(!("bottomsId" in obj.ui.lock)) obj.ui.lock.bottomsId = null;

      // defaults: tights/socks/shoes none fixed
      // （ここはインポート時の仕様として元コードを維持）
      ["tightsId","socksId","shoesId"].forEach(k=>{
        if(!(k in obj.ui.lock) || obj.ui.lock[k] == null) obj.ui.lock[k] = "none";
      });

      obj.ui.excluded = obj.ui.excluded || [];
      obj.ui.wardrobeTab = obj.ui.wardrobeTab || "outer";

      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      toast("インポートしました");
      render();
    }catch(e){
      alert("インポートに失敗しました： " + (e.message || e));
    }finally{
      file.value = "";
    }
  };

  root.querySelector("#btn-reset").onclick = () => {
    if(!confirm("全リセットしますか？")) return;
    localStorage.removeItem(STORAGE_KEY);
    toast("初期データに戻しました");
    render();
  };
}

/* utils */
function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(s){ return escapeHtml(s).replaceAll("\n"," "); }

window.addEventListener("hashchange", render);
render();
</script>
