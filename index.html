<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ぜんのすけ 服コーデ提案</title>
  <meta name="theme-color" content="#3B82F6" />
  <meta name="description" content="手持ちの服から、天気に合わせて今日のコーデを提案します。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="服コーデ" />
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --text:#111; --muted:#6b7280; --line:#e5e7eb;
      --brand:#111; --brand2:#3B82F6; --danger:#dc2626; --ok:#16a34a;
      --shadow:0 6px 18px rgba(0,0,0,.06);
      --radius:18px;
      /* z-index 一元管理 */
      --z-header:10;
      --z-nav:20;
      --z-toast:30;
      --z-modal-backdrop:40;
      --z-modal:50;
    }
    *{box-sizing:border-box}
    /* .stack 等の display 指定が hidden 属性に勝って、非表示の画面まで出てしまうのを防ぐ */
    [hidden]{display:none !important}
    body{
      margin:0;
      font-family: "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background:var(--bg); color:var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .app{max-width:520px; margin:0 auto; padding-bottom:calc(88px + env(safe-area-inset-bottom));}
    header{
      position:sticky; top:0; z-index:var(--z-header);
      background:linear-gradient(to bottom, rgba(246,247,251,0.95), rgba(246,247,251,0.75));
      backdrop-filter: blur(8px);
      padding:14px 14px 8px;
      border-bottom:1px solid rgba(229,231,235,0.6);
    }
    .title{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
    h1{margin:0; font-size:18px}
    .sub{color:var(--muted); font-size:12px; margin-top:4px}
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      border:1px solid var(--line); background:#fff;
      padding:8px 10px; border-radius:999px; font-weight:600; font-size:12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.03);
    }
    .content{padding:14px}
    .card{
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--radius); box-shadow:var(--shadow);
      padding:14px;
    }
    .stack{display:flex; flex-direction:column; gap:12px}
    .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .row .left{display:flex; align-items:center; gap:10px; min-width:0}
    .k{color:var(--muted); font-size:12px; width:56px; flex:0 0 auto}
    .v{min-width:0}
    .v .name{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .v .meta{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .btns{display:flex; gap:10px; margin-top:12px}
    button{
      appearance:none; border:none; border-radius:14px; padding:12px 12px;
      font-weight:800; font-size:14px; cursor:pointer;
    }
    .btn-primary{background:var(--brand2); color:#fff}
    .btn-ghost{background:#fff; color:var(--text); border:1px solid var(--line)}
    .btn-danger{background:#fff; color:var(--danger); border:1px solid rgba(220,38,38,.35)}
    .btn-small{padding:10px 10px; font-size:13px; border-radius:12px; white-space:nowrap; flex:0 0 auto}
    .btn-wide{width:100%}
    button:active{transform:scale(.99)}
    button[disabled]{opacity:.55; cursor:not-allowed}
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
      outline:2px solid var(--brand2); outline-offset:2px;
    }
    .tabs{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
    .tab{
      background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 8px;
      font-weight:800; font-size:13px;
    }
    .tab.active{background:var(--brand2); border-color:var(--brand2); color:#fff}
    .field{display:flex; flex-direction:column; gap:6px}
    label{font-size:12px; color:var(--muted); font-weight:700}
    input, select, textarea{
      width:100%; border:1px solid var(--line); border-radius:14px;
      padding:12px 12px; font-size:14px; background:#fff;
      outline:none;
      font-family:inherit;
    }
    textarea{min-height:84px; resize:vertical}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .switch{display:flex; align-items:center; gap:8px}
    .list{display:flex; flex-direction:column; gap:10px}
    .itemRow{
      background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.03);
    }
    .itemTop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
    .badge{
      font-size:11px; font-weight:900; padding:6px 10px; border-radius:999px;
      border:1px solid var(--line); background:#fff; white-space:nowrap; flex:0 0 auto;
    }
    .badge.off{color:var(--muted)}
    .badge.on{color:var(--ok); border-color:rgba(22,163,74,.25)}
    .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
    .hint{font-size:12px; color:var(--muted); line-height:1.35}
    .divider{height:1px; background:var(--line); margin:12px 0}
    .nav{
      position:fixed; left:0; right:0; bottom:0;
      background:#fff; border-top:1px solid var(--line);
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      z-index:var(--z-nav);
    }
    .navInner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
    .nav a{
      text-decoration:none; color:var(--muted);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      padding:10px 0; border-radius:14px; font-weight:900; font-size:12px;
    }
    .nav a.active{color:#fff; background:var(--brand2)}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace}
    .toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:calc(86px + env(safe-area-inset-bottom));
      background:#111; color:#fff; padding:10px 12px; border-radius:999px;
      font-weight:800; font-size:12px; opacity:0; pointer-events:none;
      transition:opacity .2s;
      z-index:var(--z-toast);
    }
    .toast.show{opacity:1}
    .chipRow{display:flex; gap:8px; flex-wrap:wrap}
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      font-size:12px; font-weight:900;
      padding:8px 10px; border-radius:999px;
      border:1px solid var(--line); background:#fff;
    }
    .chip strong{font-size:12px}
    /* モーダル */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      z-index:var(--z-modal-backdrop);
    }
    .modal-card{
      position:fixed; left:14px; right:14px; top:14px;
      max-width:520px; margin:0 auto; z-index:var(--z-modal);
      max-height:calc(100vh - 28px); overflow-y:auto;
    }
    /* 写真サムネイル */
    .thumb{
      width:44px; height:44px; border-radius:12px; object-fit:cover; flex:0 0 auto; display:block;
      border:1px solid var(--line); background:#f3f4f6;
    }
    .thumb.lg{width:56px; height:56px; border-radius:14px}
    .thumb.ph{
      display:flex; align-items:center; justify-content:center;
      color:var(--muted); font-weight:900; font-size:15px;
    }
    img.thumb[data-photo-view]{cursor:zoom-in}
    [data-act="photo"].thumb{cursor:pointer}
    /* カレンダー */
    .calgrid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px}
    .calhead{text-align:center; font-size:11px; font-weight:800; color:var(--muted); padding-bottom:2px}
    .calcell{
      padding:4px 2px; border-radius:12px; border:1px solid var(--line); background:#fff;
      min-height:52px; font-size:12px; font-weight:800; color:var(--text);
      display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:2px;
    }
    .calcell.today{border-color:var(--brand2)}
    .calcell.sel{background:#eff6ff; border-color:var(--brand2); box-shadow:0 0 0 1px var(--brand2) inset}
    .calcell[disabled]{opacity:.35}
    .calblank{min-height:52px}
    .scenes{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px}
    .scenes .tab{padding:10px 2px; font-size:13px}
    .dot{width:8px; height:8px; border-radius:50%; background:var(--ok); display:block}
    .calthumb{width:24px; height:24px; border-radius:7px; object-fit:cover; display:block}
    .calmark{height:24px; display:flex; align-items:center; justify-content:center}
    /* 集計バー */
    .bar{height:6px; border-radius:999px; background:#e8efff; overflow:hidden; margin-top:6px}
    .bar > i{display:block; height:100%; background:var(--brand2); border-radius:999px}
    /* 確認ダイアログ */
    .confirm-card{
      position:fixed; left:14px; right:14px; top:50%;
      transform:translateY(-50%);
      max-width:440px; margin:0 auto; z-index:var(--z-modal);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div>
          <h1>ぜんのすけ 服コーデ提案</h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <div class="pill" id="todayPill">今日</div>
      </div>
    </header>

    <main class="content">
      <section id="view-home" class="stack" role="tabpanel" aria-label="ホーム"></section>
      <section id="view-wardrobe" class="stack" role="tabpanel" aria-label="ワードローブ" hidden></section>
      <section id="view-history" class="stack" role="tabpanel" aria-label="履歴" hidden></section>
      <section id="view-settings" class="stack" role="tabpanel" aria-label="設定" hidden></section>
    </main>
  </div>

  <nav class="nav" role="navigation" aria-label="メインナビゲーション">
    <div class="navInner">
      <a href="#home" data-nav="home" class="active" role="tab" aria-selected="true">ホーム</a>
      <a href="#wardrobe" data-nav="wardrobe" role="tab" aria-selected="false">ワードローブ</a>
      <a href="#history" data-nav="history" role="tab" aria-selected="false">履歴</a>
      <a href="#settings" data-nav="settings" role="tab" aria-selected="false">設定/共有</a>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photo-file" accept="image/*" style="display:none" aria-hidden="true" />

<script>
"use strict";

/* =========================
   定数（マジックナンバー/文字列の一元管理）
   ========================= */
const STORAGE_KEY = "zennosuke_outfit_v1";
const SCHEMA_VERSION = 1;
const SUGGEST_COUNT = 3;
const RECENT_WINDOW = 10;        // 直近ペナルティの対象件数
const HISTORY_MAX = 500;          // 保存する履歴の最大件数
const HISTORY_DISPLAY_MAX = 200;  // 画面表示する履歴の最大件数
const TOAST_DURATION_MS = 1400;
const SUGGEST_TRY_MAX = 80;
const SAVE_DEBOUNCE_MS = 150;
const VALID_CATEGORIES = ["tops", "bottoms", "outer"];
const CATS = [
  { key: "tops",    label: "トップス" },
  { key: "bottoms", label: "ボトムス" },
  { key: "outer",   label: "アウター" },
];

/* 写真（IndexedDB に保存。localStorage の容量を圧迫しないため別管理） */
const PHOTO_DB = "zennosuke_photos_v1";
const PHOTO_STORE = "photos";
const PHOTO_MAX_EDGE = 600;        // 長辺をこのpxに縮小
const PHOTO_QUALITY = 0.78;        // JPEG品質
const PHOTO_MAX_CHARS = 400000;    // インポート時に受け付ける1枚あたりの最大文字数
const PHOTO_DATAURL_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/;

/* 履歴の表示 */
const IDLE_DAYS = 14;               // ホームで「しばらく着ていない」と扱う日数
const IDLE_HOME_MAX = 3;            // ホームに出す件数
/* シーン（タグ・名前に含まれる語で判定） */
const SCENES = [
  { key: "",       label: "指定なし" },
  { key: "casual", label: "普段着" },
  { key: "clean",  label: "きれいめ" },
  { key: "active", label: "運動" },
];
const SCENE_TAGS = {
  casual: ["casual", "easy", "カジュアル", "普段着", "ラフ"],
  clean:  ["clean", "formal", "office", "きれいめ", "きれい目", "フォーマル", "オフィス"],
  active: ["active", "sports", "gym", "運動", "スポーツ", "ジム"],
};
const HISTORY_TABS = ["calendar", "list", "stats"];
const STATS_RANGES = ["30", "90", "all"];
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

/* 天気連動 */
const WEATHER_KEY = "zennosuke_weather_v1";   // 天気設定・キャッシュ（端末固有のためバックアップJSONには含めない）
const WX_FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
const WX_GEOCODE_URL  = "https://geocoding-api.open-meteo.com/v1/search";
const WX_TIMEOUT_MS = 5000;
const WX_RAIN_POP = 50;                       // この降水確率(%)以上を「雨」とみなす
const WX_PRESETS = [
  { label: "札幌",   lat: 43.06, lon: 141.35 },
  { label: "仙台",   lat: 38.27, lon: 140.87 },
  { label: "東京",   lat: 35.69, lon: 139.69 },
  { label: "横浜",   lat: 35.44, lon: 139.64 },
  { label: "新潟",   lat: 37.92, lon: 139.04 },
  { label: "金沢",   lat: 36.56, lon: 136.66 },
  { label: "名古屋", lat: 35.18, lon: 136.91 },
  { label: "京都",   lat: 35.01, lon: 135.77 },
  { label: "大阪",   lat: 34.69, lon: 135.50 },
  { label: "神戸",   lat: 34.69, lon: 135.20 },
  { label: "広島",   lat: 34.40, lon: 132.46 },
  { label: "高松",   lat: 34.34, lon: 134.04 },
  { label: "福岡",   lat: 33.59, lon: 130.40 },
  { label: "鹿児島", lat: 31.60, lon: 130.56 },
  { label: "那覇",   lat: 26.21, lon: 127.68 },
];
const WX_DEFAULT_LOC = WX_PRESETS.find(p => p.label === "東京");
/* 服のタグ・名前に含まれる語から、気温への向き不向きを判定する */
const WX_TAGS = {
  warm: ["warm", "winter", "厚手", "暖かい", "あったか", "防寒", "冬"],
  cool: ["summer", "light", "cool", "薄手", "涼しい", "軽め", "夏"],
  mild: ["spring", "autumn", "fall", "春", "秋"],
  rain: ["rain", "waterproof", "防水", "撥水", "雨"],
};

/* =========================
   ユーティリティ
   ========================= */
function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function generateId(){
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  // fallback: 極稀な環境向け
  return `${Date.now().toString(16)}-${Math.random().toString(36).slice(2, 10)}-${Math.random().toString(36).slice(2, 10)}`;
}

function fmtDate(ts){
  return new Date(ts).toLocaleString("ja-JP");
}

/** ローカル日付キー（YYYY-MM-DD）。日付またぎ判定・1日1件制御に使う */
function dayKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/** 服のタグ・名前が words のいずれかに当てはまるか（英語は完全一致、日本語は名前の部分一致も見る） */
function itemMatches(item, words){
  const tags = (item.tags || []).map(t => String(t).toLowerCase());
  const name = String(item.name || "").toLowerCase();
  return words.some(w => tags.includes(w) || (!/^[\x00-\x7f]+$/.test(w) && name.includes(w)));
}

/** 服ID → 最後に着た日時 */
function lastWornMap(history){
  const m = new Map();
  for (const h of history) {
    for (const id of [h.topsId, h.bottomsId, h.outerId]) {
      if (!id) continue;
      const prev = m.get(id);
      if (prev === undefined || h.at > prev) m.set(id, h.at);
    }
  }
  return m;
}

/**
 * しばらく着ていない服（有効なもののみ）。未着用が先、次に最後に着た日が古い順。
 * minDays 以上着ていない（または未着用）ものだけに絞る。履歴が空なら空配列。
 */
function idleItems(st, limit, minDays){
  if (st.history.length === 0) return [];
  const last = lastWornMap(st.history);
  return st.wardrobe
    .filter(x => x.enabled)
    .map(it => ({ it, at: last.get(it.id) }))
    .filter(x => x.at === undefined || daysSince(x.at) >= minDays)
    .sort((a, b) => {
      if (a.at === undefined && b.at === undefined) return a.it.createdAt - b.it.createdAt;
      if (a.at === undefined) return -1;
      if (b.at === undefined) return 1;
      return a.at - b.at;
    })
    .slice(0, limit);
}

/** 履歴を日時の昇順に整える（「直近N件」の判定や上限カットが並び順に依存するため） */
function sortHistory(st){
  st.history.sort((a, b) => a.at - b.at);
}

/** その日の記録に使う時刻。今日なら現在時刻、過去日なら正午（日付の判定がずれないように） */
function atForDay(day){
  if (day === dayKey(Date.now())) return Date.now();
  const [y, m, d] = day.split("-").map(Number);
  return new Date(y, m - 1, d, 12, 0, 0).getTime();
}

/** ts がある日が、今日から何日前か（今日=0） */
function daysSince(ts){
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ts); b.setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}

function agoLabel(ts){
  if (ts === null || ts === undefined) return "未着用";
  const n = daysSince(ts);
  if (n <= 0) return "今日";
  if (n === 1) return "昨日";
  if (n < 60) return `${n}日前`;
  return `約${Math.floor(n / 30)}か月前`;
}

/** カレンダーの表示状態（画面内のみ。保存しない） */
const Cal = {
  month: dayKey(Date.now()).slice(0, 7),   // 表示中の月 "YYYY-MM"
  day: "",                                  // 選択中の日 "YYYY-MM-DD"
  edit: false,                              // 選択日の記録を編集中か
};

/** いま選択扱いの日。選択がなければ、今月を見ているときだけ今日 */
function calSelectedDay(){
  const todayK = dayKey(Date.now());
  if (Cal.day && Cal.day.startsWith(Cal.month)) return Cal.day;
  return Cal.month === todayK.slice(0, 7) ? todayK : "";
}

function shiftMonth(m, delta){
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/**
 * 画像ファイルを縮小して JPEG の dataURL にする。
 * EXIF の向きは createImageBitmap(from-image) に任せ、使えない環境は Image にフォールバック。
 */
async function fileToDataUrl(file){
  if (!file || !/^image\//.test(file.type || "")) throw new Error("not an image");
  let bmp = null;
  if (typeof createImageBitmap === "function") {
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { bmp = null; }
  }
  if (!bmp) {
    const url = URL.createObjectURL(file);
    try {
      bmp = await new Promise((resolve, reject) => {
        const im = new Image();
        const t = setTimeout(() => reject(new Error("timeout")), 10000);
        im.onload = () => { clearTimeout(t); resolve(im); };
        im.onerror = () => { clearTimeout(t); reject(new Error("decode failed")); };
        im.src = url;
      });
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  const w0 = bmp.width, h0 = bmp.height;
  if (!w0 || !h0) throw new Error("empty image");
  const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale));
  const h = Math.max(1, Math.round(h0 * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";                 // 透過PNGの背景を白に
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  if (typeof bmp.close === "function") bmp.close();
  return canvas.toDataURL("image/jpeg", PHOTO_QUALITY);
}

/**
 * 服のサムネイルHTML。写真が1枚も登録されていなければ空（レイアウトを変えない）。
 * 写真のない服は頭文字のプレースホルダーを出して行の揃いを保つ。
 */
function thumbHtml(item){
  if (PhotoStore.count() === 0) return "";
  const src = item ? PhotoStore.get(item.id) : null;
  if (src) {
    return `<img class="thumb" src="${src}" alt="${escapeHtml(item.name)}" data-photo-view="${escapeHtml(item.id)}">`;
  }
  const ch = item ? [...String(item.name)][0] || "−" : "−";
  return `<div class="thumb ph" aria-hidden="true">${escapeHtml(ch)}</div>`;
}

/** 履歴から「今日」の採用エントリ（最新）を返す。なければ null */
function todaysEntry(history){
  const k = dayKey(Date.now());
  let found = null;
  for (const h of history) {
    if (dayKey(h.at) === k && (!found || h.at >= found.at)) found = h;
  }
  return found;
}

function catLabel(key){
  const c = CATS.find(x => x.key === key);
  return c ? c.label : key;
}

function debounce(fn, ms){
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

/* =========================
   ストア（状態管理・IIFE でカプセル化）
   ========================= */
const Store = (() => {
  let state = null;

  function defaultState(){
    return {
      version: SCHEMA_VERSION,
      wardrobe: seedWardrobe(),
      history: [],
      ui: {
        lock: { topsId: null, bottomsId: null, outerId: null },
        excluded: [],
        excludedDay: "",   // excluded を作った日（日付が変わったらリセット）
        cands: [],         // 表示中の候補（ID の組）。再描画しても維持する
        candsWx: "",       // 候補を作ったときの天気の区分（変わったら候補を作り直す）
        historyTab: "calendar",
        statsRange: "30",
        scene: "",         // ""=指定なし / casual / clean / active
        currentView: "home",
        wardrobeTab: "tops",
      },
    };
  }

  function seedWardrobe(){
    const seeds = [
      { category: "tops", name: "ボーダー長袖",    color: "navy/white", tags: ["casual"], priority: 4, enabled: true },
      { category: "tops", name: "グレーのトレーナー", color: "gray",    tags: ["warm"],   priority: 3, enabled: true },
      { category: "tops", name: "白Tシャツ",        color: "white",     tags: ["basic", "light"], priority: 5, enabled: true },
      { category: "bottoms", name: "デニム",            color: "indigo", tags: ["casual"], priority: 4, enabled: true },
      { category: "bottoms", name: "黒のスウェット",     color: "black",  tags: ["easy"],   priority: 5, enabled: true },
      { category: "bottoms", name: "ベージュのチノ",    color: "beige",  tags: ["clean"],  priority: 3, enabled: true },
      { category: "outer", name: "薄手のパーカー",       color: "beige",  tags: ["spring"], priority: 3, enabled: true },
      { category: "outer", name: "ウィンドブレーカー", color: "navy",   tags: ["active", "rain"], priority: 4, enabled: true },
    ];
    const now = Date.now();
    return seeds.map(x => ({
      ...x,
      id: generateId(),
      createdAt: now,
      updatedAt: now,
    }));
  }

  /**
   * インポートされたデータを厳密にバリデーション。
   * 失敗時は Error を投げ、成功時は正規化済みのstateを返す。
   */
  function validateAndNormalize(raw){
    if (!raw || typeof raw !== "object") throw new Error("JSONオブジェクトではありません");

    if (!Array.isArray(raw.wardrobe)) throw new Error("wardrobe が配列ではありません");
    if (!Array.isArray(raw.history))  throw new Error("history が配列ではありません");

    // wardrobe の各アイテム
    const wardrobe = raw.wardrobe.map((it, idx) => {
      if (!it || typeof it !== "object") throw new Error(`wardrobe[${idx}] が不正です`);
      if (typeof it.name !== "string" || !it.name.trim())   throw new Error(`wardrobe[${idx}].name が不正です`);
      if (typeof it.color !== "string" || !it.color.trim()) throw new Error(`wardrobe[${idx}].color が不正です`);
      if (!VALID_CATEGORIES.includes(it.category))          throw new Error(`wardrobe[${idx}].category が不正です`);
      const priority = Number(it.priority);
      if (!Number.isFinite(priority) || priority < 1 || priority > 5) {
        throw new Error(`wardrobe[${idx}].priority が範囲外です (1-5)`);
      }
      return {
        id: typeof it.id === "string" && it.id ? it.id : generateId(),
        category: it.category,
        name: it.name.trim(),
        color: it.color.trim(),
        tags: Array.isArray(it.tags) ? it.tags.filter(t => typeof t === "string") : [],
        priority,
        enabled: it.enabled !== false,
        createdAt: Number(it.createdAt) || Date.now(),
        updatedAt: Number(it.updatedAt) || Date.now(),
      };
    });

    const validIds = new Set(wardrobe.map(w => w.id));

    // history の各エントリ
    const history = raw.history.map((h, idx) => {
      if (!h || typeof h !== "object") throw new Error(`history[${idx}] が不正です`);
      if (typeof h.topsId !== "string" || typeof h.bottomsId !== "string") {
        throw new Error(`history[${idx}] のID形式が不正です`);
      }
      return {
        id: typeof h.id === "string" && h.id ? h.id : generateId(),
        at: Number(h.at) || Date.now(),
        topsId: h.topsId,
        bottomsId: h.bottomsId,
        outerId: typeof h.outerId === "string" ? h.outerId : null,
      };
    }).sort((a, b) => a.at - b.at);   // 日時の昇順に統一

    // UI
    const rawUi = (raw.ui && typeof raw.ui === "object") ? raw.ui : {};
    const rawLock = (rawUi.lock && typeof rawUi.lock === "object") ? rawUi.lock : {};
    const safeLockId = (v) => (typeof v === "string" && validIds.has(v)) ? v : null;
    const outerLock = (() => {
      if (rawLock.outerId === "none") return "none";
      if (typeof rawLock.outerId === "string" && validIds.has(rawLock.outerId)) return rawLock.outerId;
      return null;
    })();

    return {
      version: SCHEMA_VERSION,
      wardrobe,
      history,
      ui: {
        lock: {
          topsId:    safeLockId(rawLock.topsId),
          bottomsId: safeLockId(rawLock.bottomsId),
          outerId:   outerLock,
        },
        excluded: Array.isArray(rawUi.excluded) ? rawUi.excluded.filter(x => typeof x === "string") : [],
        excludedDay: typeof rawUi.excludedDay === "string" ? rawUi.excludedDay : "",
        candsWx: typeof rawUi.candsWx === "string" ? rawUi.candsWx : "",
        historyTab: HISTORY_TABS.includes(rawUi.historyTab) ? rawUi.historyTab : "calendar",
        statsRange: STATS_RANGES.includes(rawUi.statsRange) ? rawUi.statsRange : "30",
        scene: SCENES.some(x => x.key === rawUi.scene) ? rawUi.scene : "",
        cands: Array.isArray(rawUi.cands)
          ? rawUi.cands
              .filter(c => c && typeof c.topsId === "string" && typeof c.bottomsId === "string")
              .map(c => ({
                topsId: c.topsId,
                bottomsId: c.bottomsId,
                outerId: typeof c.outerId === "string" ? c.outerId : null,
              }))
              .slice(0, SUGGEST_COUNT)
          : [],
        currentView: ["home","wardrobe","history","settings"].includes(rawUi.currentView) ? rawUi.currentView : "home",
        wardrobeTab: VALID_CATEGORIES.includes(rawUi.wardrobeTab) ? rawUi.wardrobeTab : "tops",
      },
    };
  }

  function loadFromStorage(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return validateAndNormalize(parsed);
    } catch {
      // 破損データでも初期状態で起動できる
      return null;
    }
  }

  function persist(){
    try {
      // 履歴の上限管理（古いものから捨てる）
      if (state.history.length > HISTORY_MAX) {
        state.history = state.history.slice(-HISTORY_MAX);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return { ok: true };
    } catch (e) {
      if (e && e.name === "QuotaExceededError") {
        return { ok: false, reason: "quota" };
      }
      return { ok: false, reason: "unknown", error: e };
    }
  }

  const persistDebounced = debounce(() => {
    const r = persist();
    if (!r.ok) {
      if (r.reason === "quota") UI.toast("保存容量が上限に達しました");
      else UI.toast("保存に失敗しました");
    }
  }, SAVE_DEBOUNCE_MS);

  return {
    init(){
      state = loadFromStorage() || defaultState();
      const r = persist();
      if (!r.ok && r.reason === "quota") {
        UI.toast("保存容量が上限に達しました");
      }
      return state;
    },
    get: () => state,
    save: () => persistDebounced(),
    saveImmediate: () => persist(),
    replace(newState){
      state = newState;
      return persist();
    },
    reset(){
      state = defaultState();
      return persist();
    },
    /**
     * 日付が変わっていたら「除外」と「候補」をリセットする。
     * 変更があれば true（呼び出し側で保存・再描画する）。
     */
    rollover(){
      const today = dayKey(Date.now());
      const ui = state.ui;
      if (ui.excludedDay === today) return false;
      ui.excludedDay = today;
      ui.excluded = [];
      ui.cands = [];
      return true;
    },
    validate: validateAndNormalize,
    defaultState,
  };
})();

/* =========================
   写真ストア（IndexedDB）
   - 服のID → 縮小済み JPEG の dataURL
   - 全件をメモリにキャッシュし、描画は同期で参照できる
   - IndexedDB が使えない環境でも、そのセッション中だけメモリで動く
   ========================= */
const PhotoStore = (() => {
  const cache = new Map();
  let db = null;
  let persistent = false;

  function openDb(){
    return new Promise((resolve) => {
      try {
        if (typeof indexedDB === "undefined" || !indexedDB) { resolve(null); return; }
        const req = indexedDB.open(PHOTO_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(PHOTO_STORE)) req.result.createObjectStore(PHOTO_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch {
        resolve(null);
      }
    });
  }

  /** 1つのトランザクションを実行し、完了したら true */
  function run(mode, fn){
    return new Promise((resolve) => {
      if (!db) { resolve(false); return; }
      try {
        const tx = db.transaction(PHOTO_STORE, mode);
        fn(tx.objectStore(PHOTO_STORE));
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  async function init(){
    db = await openDb();
    if (!db) return;
    persistent = true;
    await new Promise((resolve) => {
      try {
        const tx = db.transaction(PHOTO_STORE, "readonly");
        const rq = tx.objectStore(PHOTO_STORE).openCursor();
        rq.onsuccess = () => {
          const c = rq.result;
          if (c) {
            if (PHOTO_DATAURL_RE.test(String(c.value))) cache.set(String(c.key), c.value);
            c.continue();
          } else {
            resolve();
          }
        };
        rq.onerror = () => resolve();
        tx.onabort = () => resolve();
      } catch {
        resolve();
      }
    });
  }

  return {
    init,
    get: (id) => cache.get(id) || null,
    has: (id) => cache.has(id),
    count: () => cache.size,
    isPersistent: () => persistent,
    validDataUrl: (s) => typeof s === "string" && s.length <= PHOTO_MAX_CHARS && PHOTO_DATAURL_RE.test(s),

    /** 保存する。端末に永続化できたら true（メモリには常に入る） */
    async set(id, dataUrl){
      cache.set(id, dataUrl);
      return run("readwrite", (s) => s.put(dataUrl, id));
    },
    async remove(id){
      if (!cache.delete(id)) return true;
      return run("readwrite", (s) => s.delete(id));
    },
    async clear(){
      cache.clear();
      return run("readwrite", (s) => s.clear());
    },
    /** 指定IDの写真だけを { id: dataUrl } で返す（バックアップ用） */
    exportAll(idSet){
      const out = {};
      for (const [id, url] of cache) if (idSet.has(id)) out[id] = url;
      return out;
    },
    /** インポート：keepIds に無い写真を捨て、incoming を上書き保存する */
    async syncTo(keepIds, incoming){
      for (const id of [...cache.keys()]) if (!keepIds.has(id)) await this.remove(id);
      for (const [id, url] of Object.entries(incoming || {})) await this.set(id, url);
    },
  };
})();

/* =========================
   天気（Open-Meteo・APIキー不要）
   - 設定とその日の予報を端末内にキャッシュ（1日1回だけ取得）
   - 気温帯に応じて「アウターの有無」と「服の選ばれやすさ」を調整
   ========================= */
const Weather = (() => {
  let st = { enabled: true, loc: { ...WX_DEFAULT_LOC }, data: null };
  let inflight = null;
  let inflightKey = "";
  let reqId = 0;
  let lastError = false;
  let changeCb = () => {};

  const num = (v) => (typeof v === "number" && Number.isFinite(v)) ? v : null;
  const r2 = (v) => Number(Number(v).toFixed(2));
  const todayKey = () => dayKey(Date.now());

  // 気温帯ごとの係数（warm=暖かい服 / cool=涼しい服 / mild=春秋の服）
  const WARM_F = { hot: 0.15, warm: 0.5, mild: 1,   cool: 1.6, cold: 2.6 };
  const COOL_F = { hot: 2.4,  warm: 1.6, mild: 1,   cool: 0.5, cold: 0.2 };
  const MILD_F = { hot: 0.6,  warm: 1.2, mild: 1.6, cool: 1.3, cold: 0.6 };
  // 「アウターなし」になる目標確率。アウターの数や優先度に左右されないよう、
  // 提案側で「アウター全体の重み」に対するオッズ p/(1-p) に換算して使う
  const OUTER_NONE_P = { hot: 0.92, warm: 0.55, mild: 0.08, cool: 0.02, cold: 0.005 };
  const TIER_LABEL = { hot: "暑い", warm: "暖かい", mild: "過ごしやすい", cool: "肌寒い", cold: "寒い" };
  const TIER_ADVICE = {
    hot:  "アウターは不要。涼しい素材・薄手のトップスがおすすめ。",
    warm: "アウターはなくても過ごせます。羽織るなら薄手のものを。",
    mild: "薄手のアウターがあると安心な気温です。",
    cool: "朝晩は冷えます。アウターを着るのがおすすめ。",
    cold: "しっかりしたアウターと暖かい服がおすすめ。",
  };

  function load(){
    try {
      const raw = JSON.parse(localStorage.getItem(WEATHER_KEY) || "null");
      if (!raw || typeof raw !== "object") return;
      if (typeof raw.enabled === "boolean") st.enabled = raw.enabled;
      const l = raw.loc;
      if (l && num(l.lat) !== null && num(l.lon) !== null && typeof l.label === "string" && l.label) {
        st.loc = { lat: l.lat, lon: l.lon, label: l.label };
      }
      const d = raw.data;
      if (d && typeof d.day === "string" && num(d.tmax) !== null && num(d.tmin) !== null
          && num(d.lat) !== null && num(d.lon) !== null) {
        st.data = {
          day: d.day, lat: d.lat, lon: d.lon, tmax: d.tmax, tmin: d.tmin,
          pop: num(d.pop) ?? 0, code: num(d.code),
        };
      }
    } catch { /* 破損していても既定値で動く */ }
  }

  function save(){
    try { localStorage.setItem(WEATHER_KEY, JSON.stringify(st)); } catch { /* 容量不足などは無視 */ }
  }

  function dataIsFresh(){
    const d = st.data;
    return !!d && d.day === todayKey() && d.lat === st.loc.lat && d.lon === st.loc.lon;
  }

  /** 今日の予報（無効・未取得・古い場合は null） */
  function current(){ return (st.enabled && dataIsFresh()) ? st.data : null; }

  function tierOf(d){
    const t = d.tmax * 0.6 + d.tmin * 0.4;   // 日中を重視しつつ朝晩の冷えも加味
    if (t >= 25) return "hot";
    if (t >= 20) return "warm";
    if (t >= 15) return "mild";
    if (t >= 10) return "cool";
    return "cold";
  }
  const isRainy = (d) => d.pop >= WX_RAIN_POP;

  /** 候補を作り直すかどうかの判定用。天気の区分が変わったら値が変わる */
  function signature(){
    const d = current();
    return d ? `${tierOf(d)}|${isRainy(d) ? 1 : 0}` : "none";
  }

  function hasTag(item, group){
    return itemMatches(item, WX_TAGS[group]);
  }

  /** 服1点の選ばれやすさの係数（タグ・名前なし=1） */
  function factor(item, d){
    const tier = tierOf(d);
    let f = 1;
    if (hasTag(item, "warm")) f *= WARM_F[tier];
    if (hasTag(item, "cool")) f *= COOL_F[tier];
    if (hasTag(item, "mild")) f *= MILD_F[tier];
    if (isRainy(d) && hasTag(item, "rain")) f *= 2.5;
    return f;
  }

  /** 「アウターなし」の重み ÷ 「アウター全体の重み」。雨の日はアウターを着やすいよう半分に */
  function outerNoneOdds(d){
    const p = OUTER_NONE_P[tierOf(d)];
    return (p / (1 - p)) * (isRainy(d) ? 0.5 : 1);
  }

  function codeLabel(c){
    if (c === null || c === undefined) return "";
    if (c === 0) return "快晴";
    if (c === 1) return "晴れ";
    if (c === 2) return "薄曇り";
    if (c === 3) return "曇り";
    if (c === 45 || c === 48) return "霧";
    if (c >= 51 && c <= 57) return "霧雨";
    if (c === 66 || c === 67) return "みぞれ";
    if (c >= 61 && c <= 65) return "雨";
    if (c >= 71 && c <= 77) return "雪";
    if (c >= 80 && c <= 82) return "にわか雨";
    if (c === 85 || c === 86) return "にわか雪";
    if (c >= 95) return "雷雨";
    return "";
  }

  function summaryText(d){
    const desc = codeLabel(d.code);
    return `${desc ? desc + " " : ""}${Math.round(d.tmax)}° / ${Math.round(d.tmin)}° ・ 降水確率 ${Math.round(d.pop)}%`;
  }

  async function fetchJson(url){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), WX_TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error(`http ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  /**
   * 今日の予報を取得する。新鮮なキャッシュがあれば何もしない（force で強制）。
   * 成功したら true。
   */
  function refresh(force = false){
    if (!st.enabled) return Promise.resolve(false);
    if (!force && dataIsFresh()) return Promise.resolve(false);
    // 同じ地域の取得がすでに走っていればそれに乗る（地域が違えば新しく取り直す）
    if (inflight && inflightKey === `${st.loc.lat},${st.loc.lon}`) return inflight;

    const loc = { ...st.loc };
    const myId = ++reqId;
    inflightKey = `${loc.lat},${loc.lon}`;
    const url = `${WX_FORECAST_URL}?latitude=${loc.lat}&longitude=${loc.lon}`
      + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code`
      + `&timezone=auto&forecast_days=1`;

    const p = (async () => {
      let ok = false;
      try {
        const j = await fetchJson(url);
        const dd = j && j.daily;
        const tmax = num(dd?.temperature_2m_max?.[0]);
        const tmin = num(dd?.temperature_2m_min?.[0]);
        if (tmax === null || tmin === null) throw new Error("invalid response");
        // より新しい取得が始まっていたら（地域変更など）この結果は捨てる
        if (myId === reqId) {
          st.data = {
            day: todayKey(), lat: loc.lat, lon: loc.lon, tmax, tmin,
            pop: num(dd?.precipitation_probability_max?.[0]) ?? 0,
            code: num(dd?.weather_code?.[0]),
          };
          save();
          lastError = false;
          ok = true;
        }
      } catch {
        if (myId === reqId) lastError = true;
      } finally {
        if (myId === reqId) {
          inflight = null;
          changeCb();
        }
      }
      return ok;
    })();
    inflight = p;
    return p;
  }

  function setLocation(loc){
    st.loc = { lat: r2(loc.lat), lon: r2(loc.lon), label: String(loc.label || "指定地点") };
    st.data = null;
    lastError = false;
    save();
    return refresh(true);
  }

  function setEnabled(on){
    st.enabled = !!on;
    save();
    const p = st.enabled ? refresh() : Promise.resolve(false);
    if (!inflight) changeCb();   // 取得が走らない場合は即時に画面へ反映
    return p;
  }

  /** 地名検索。2文字だと完全一致のみのため、見つからなければ「市」を付けて再検索 */
  async function search(q){
    const name = String(q || "").trim();
    if (!name) return [];
    const query = async (n) => {
      const j = await fetchJson(`${WX_GEOCODE_URL}?name=${encodeURIComponent(n)}&count=5&language=ja&format=json`);
      return Array.isArray(j?.results) ? j.results : [];   // 0件のときは results キーごと無い
    };
    let r = await query(name);
    if (r.length === 0 && !/[市区町村]$/.test(name)) r = await query(name + "市");
    return r
      .filter(x => num(x.latitude) !== null && num(x.longitude) !== null && x.name)
      .map(x => ({
        label: String(x.name),
        sub: [x.admin1, x.country].filter(Boolean).join(" / "),
        lat: r2(x.latitude),
        lon: r2(x.longitude),
      }));
  }

  /** 端末の現在地（座標は小数2桁に丸めて保持） */
  function locate(){
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error("unsupported")); return; }
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: r2(p.coords.latitude), lon: r2(p.coords.longitude), label: "現在地" }),
        reject,
        { timeout: 10000, maximumAge: 600000 }
      );
    });
  }

  function statusText(){
    if (!st.enabled) return "オフ（天気は提案に反映されません）";
    if (inflight && !current()) return "取得中…";
    const d = current();
    if (d) return `${st.loc.label}：${summaryText(d)}`;
    if (lastError) return "天気を取得できませんでした（オフラインの可能性）。「天気を更新」で再試行できます。";
    return "未取得";
  }

  load();

  return {
    init(){ return refresh(); },
    onChange(cb){ changeCb = cb; },
    current, signature, factor, outerNoneOdds, tierOf, isRainy,
    refresh, setLocation, setEnabled, search, locate,
    statusText, summaryText,
    tierLabel: (d) => TIER_LABEL[tierOf(d)],
    tierAdvice: (d) => TIER_ADVICE[tierOf(d)],
    isEnabled: () => st.enabled,
    isPending: () => st.enabled && !!inflight && !current(),
    location: () => ({ ...st.loc }),
  };
})();

/* =========================
   提案ロジック
   ========================= */
const Suggest = (() => {
  function outfitKey(o){
    return `${o.tops.id}|${o.bottoms.id}|${o.outer ? o.outer.id : "none"}`;
  }

  function buildRecentUseMap(history, n){
    const m = new Map();
    const recent = history.slice(-n);
    for (const h of recent) {
      for (const id of [h.topsId, h.bottomsId, h.outerId].filter(Boolean)) {
        m.set(id, (m.get(id) || 0) + 1);
      }
    }
    return m;
  }

  function penaltyFor(id, recentMap){
    const c = recentMap.get(id) || 0;
    if (c >= 3) return 0.2;
    if (c >= 1) return 0.6;
    return 1.0;
  }

  function weightedPick(items, weightFn){
    if (items.length === 0) return null;
    const ws = items.map(weightFn);
    const total = ws.reduce((a, b) => a + b, 0);
    if (total <= 0) return null;
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
      r -= ws[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  }

  function enabledMap(state){
    return new Map(state.wardrobe.filter(x => x.enabled).map(x => [x.id, x]));
  }

  /**
   * 実効ロック：有効なアイテムを指しているロックだけを有効とみなす。
   * （無効化・削除されたアイテムのロックは「固定しない」扱い）
   * outerId: null=固定しない / "none"=なし固定 / itemId=そのアウター固定
   */
  function effectiveLock(state, byId){
    const l = state.ui.lock || {};
    const pick = (id, cat) => {
      const it = id ? byId.get(id) : null;
      return (it && it.category === cat) ? it.id : null;
    };
    return {
      topsId:    pick(l.topsId, "tops"),
      bottomsId: pick(l.bottomsId, "bottoms"),
      outerId:   l.outerId === "none" ? "none" : pick(l.outerId, "outer"),
    };
  }

  function matchesLock(o, lock){
    if (lock.topsId    && o.tops.id    !== lock.topsId)    return false;
    if (lock.bottomsId && o.bottoms.id !== lock.bottomsId) return false;
    if (lock.outerId === "none") return o.outer === null;
    if (lock.outerId) return !!o.outer && o.outer.id === lock.outerId;
    return true;
  }

  /** シーン選択時：合う服は選ばれやすく(×3)、他のシーン向けの服は選ばれにくく(×0.25)。タグなしは変えない */
  function sceneFactor(item, scene){
    if (!scene || !SCENE_TAGS[scene]) return 1;
    if (itemMatches(item, SCENE_TAGS[scene])) return 3;
    const other = Object.keys(SCENE_TAGS).some(k => k !== scene && itemMatches(item, SCENE_TAGS[k]));
    return other ? 0.25 : 1;
  }

  function toCand(o){
    return { topsId: o.tops.id, bottomsId: o.bottoms.id, outerId: o.outer ? o.outer.id : null };
  }

  /**
   * 新しい候補を最大 count 件つくる。avoidKeys に含まれる組み合わせは出さない。
   */
  function generate(state, count = SUGGEST_COUNT, avoidKeys = null){
    const byId = enabledMap(state);
    const enabled = [...byId.values()];
    const tops    = enabled.filter(x => x.category === "tops");
    const bottoms = enabled.filter(x => x.category === "bottoms");
    const outers  = enabled.filter(x => x.category === "outer");

    const lock = effectiveLock(state, byId);
    const lockedTops    = lock.topsId    ? byId.get(lock.topsId)    : null;
    const lockedBottoms = lock.bottomsId ? byId.get(lock.bottomsId) : null;

    // lockedOuter: undefined=固定しない / null=なし固定 / item=そのアウター固定
    let lockedOuter;
    if (lock.outerId === "none") lockedOuter = null;
    else if (lock.outerId)       lockedOuter = byId.get(lock.outerId);
    else                         lockedOuter = undefined;

    if (!lockedTops    && tops.length === 0)    return [];
    if (!lockedBottoms && bottoms.length === 0) return [];

    const recentMap = buildRecentUseMap(state.history, RECENT_WINDOW);
    const excluded = new Set(state.ui.excluded || []);
    const outerPool = [null, ...outers];

    // 天気連動：気温帯に応じて服の重みとアウターなしの重みを調整（天気がなければ従来どおり）
    const wx = Weather.current();
    const scene = state.ui.scene || "";
    const weightOf = (it) => {
      const base = (it.priority || 3) ** 2;
      return base * penaltyFor(it.id, recentMap) * (wx ? Weather.factor(it, wx) : 1) * sceneFactor(it, scene);
    };
    // アウターなしの重み：天気があれば目標確率から逆算、なければ従来どおり 0.8
    const noneWeight = wx
      ? Weather.outerNoneOdds(wx) * outers.reduce((sum, it) => sum + weightOf(it), 0)
      : 0.8;

    const pickItem = (pool) => weightedPick(pool, weightOf);

    const pickOuter = () => weightedPick(outerPool, it => (it === null ? noneWeight : weightOf(it)));

    const seen = new Set(avoidKeys || []);
    const out = [];
    for (let tries = 0; tries < SUGGEST_TRY_MAX && out.length < count; tries++) {
      const t = lockedTops ?? pickItem(tops);
      const b = lockedBottoms ?? pickItem(bottoms);
      if (!t || !b) break;
      const o = (lockedOuter === undefined) ? pickOuter() : lockedOuter;

      const outfit = { tops: t, bottoms: b, outer: o };
      const k = outfitKey(outfit);
      if (excluded.has(k) || seen.has(k)) continue;
      seen.add(k);
      out.push(outfit);
    }
    return out;
  }

  /**
   * 表示中の候補（state.ui.cands）を現在の状態に「整合」させる。
   *  - 有効で、除外されておらず、ロック条件を満たす候補はそのまま残す
   *  - そうでない候補だけ捨て、足りない分を新しく補充する
   * これにより、ロック変更・採用・除外・タブ移動のたびに全候補が引き直されない。
   * 戻り値は描画用のアイテム実体の配列。state.ui.cands も更新する。
   */
  function reconcile(state, count = SUGGEST_COUNT){
    const byId = enabledMap(state);
    const excluded = new Set(state.ui.excluded || []);
    const lock = effectiveLock(state, byId);

    // 各スロットの位置を保つ：無効になったスロットだけが、その場で新しい候補に入れ替わる
    const slots = new Array(count).fill(null);
    const seen = new Set();
    const cands = state.ui.cands || [];
    for (let i = 0; i < count && i < cands.length; i++) {
      const c = cands[i];
      const t = byId.get(c.topsId);
      const b = byId.get(c.bottomsId);
      if (!t || t.category !== "tops" || !b || b.category !== "bottoms") continue;
      let o = null;
      if (c.outerId) {
        o = byId.get(c.outerId);
        if (!o || o.category !== "outer") continue;
      }
      const outfit = { tops: t, bottoms: b, outer: o };
      const k = outfitKey(outfit);
      if (excluded.has(k) || seen.has(k) || !matchesLock(outfit, lock)) continue;
      seen.add(k);
      slots[i] = outfit;
    }

    const need = slots.filter(s => s === null).length;
    const fill = need > 0 ? generate(state, need, seen) : [];
    let fi = 0;
    for (let i = 0; i < count && fi < fill.length; i++) {
      if (slots[i] === null) slots[i] = fill[fi++];
    }

    // 補充できなかった空きスロットは詰める
    const result = slots.filter(Boolean);
    state.ui.cands = result.map(toCand);
    return result;
  }

  return { generate, reconcile, outfitKey };
})();

  /* ---------- HISTORY ---------- */
  function renderHistory(){
    const st = Store.get();
    const root = views.history;
    const tab = st.ui.historyTab;
    const tabs = [["calendar", "カレンダー"], ["list", "リスト"], ["stats", "着用回数"]];

    const head = `
      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:900; font-size:16px">履歴</div>
            <div class="hint">${st.history.length} 件の記録</div>
          </div>
          ${tab === "list"
            ? `<button class="btn-danger btn-small" data-act="clear-history" ${st.history.length ? "" : "disabled"}>全消し</button>`
            : ""}
        </div>
        <div style="margin-top:12px" class="tabs" role="tablist">
          ${tabs.map(([k, label]) => `
            <button class="tab ${k === tab ? "active" : ""}" data-act="hist-tab" data-tab="${k}" role="tab" aria-selected="${k === tab}">${label}</button>
          `).join("")}
        </div>

    `;

    let body;

    else if (tab === "stats") body = renderStatsBody(st);
    else body = renderListBody(st);
    root.innerHTML = head + body;
  }

  /* リスト：新しい順 */
  function renderListBody(st){
    const byId = new Map(st.wardrobe.map(x => [x.id, x]));
    const rows = [...st.history].reverse().slice(0, HISTORY_DISPLAY_MAX);
    return `
      <div class="stack" id="hist-list">
        ${rows.length === 0
          ? `<div class="card"><div class="hint">まだ記録がありません。ホームで「採用」するか、カレンダーから記録してください。</div></div>`
          : rows.map(h => {
              const t = byId.get(h.topsId);
              const b = byId.get(h.bottomsId);
              const o = h.outerId ? byId.get(h.outerId) : null;
              return `
                <div class="card">
                  <div class="hint">${escapeHtml(fmtDate(h.at))}</div>
                  <div style="margin-top:10px" class="stack">
                    ${renderHistoryLine("トップス", t, false)}
                    ${renderHistoryLine("ボトムス", b, false)}
                    ${renderHistoryLine("アウター", o, true)}
                  </div>
                </div>
              `;
            }).join("")
        }
        ${st.history.length > HISTORY_DISPLAY_MAX ? `<div class="hint">最新 ${HISTORY_DISPLAY_MAX} 件まで表示しています</div>` : ""}
      </div>
    `;
  }

  /* カレンダー：月表示＋選択した日の記録（追加・変更・削除） */
  function renderCalendarBody(st){
    const [yy, mm] = Cal.month.split("-").map(Number);
    const todayK = dayKey(Date.now());
    const curMonth = todayK.slice(0, 7);
    const lead = new Date(yy, mm - 1, 1).getDay();    // 月初の曜日（日曜始まり）
    const dim = new Date(yy, mm, 0).getDate();         // その月の日数
    const byId = new Map(st.wardrobe.map(x => [x.id, x]));

    // 日ごとの記録（同じ日に複数あれば最新）
    const byDay = new Map();
    for (const h of st.history) {
      const k = dayKey(h.at);
      const prev = byDay.get(k);
      if (!prev || h.at >= prev.at) byDay.set(k, h);
    }

    const selDay = calSelectedDay();

    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(`<div class="calblank"></div>`);
    for (let d = 1; d <= dim; d++) {
      const k = `${Cal.month}-${String(d).padStart(2, "0")}`;
      const entry = byDay.get(k);
      const future = k > todayK;
      let mark = `<span class="calmark"></span>`;
      if (entry) {
        const topsItem = byId.get(entry.topsId);
        const src = topsItem ? PhotoStore.get(topsItem.id) : null;
        mark = `<span class="calmark">${src ? `<img class="calthumb" src="${src}" alt="">` : `<span class="dot"></span>`}</span>`;
      }
      cells.push(`
        <button class="calcell${k === todayK ? " today" : ""}${k === selDay ? " sel" : ""}"
                data-act="cal-day" data-day="${k}" ${future ? "disabled" : ""}
                aria-label="${mm}月${d}日${entry ? "（記録あり）" : ""}"><span>${d}</span>${mark}</button>
      `);
    }

    return `
      <div class="card">
        <div class="row">
          <button class="btn-ghost btn-small" data-act="cal-prev" aria-label="前の月">‹</button>
          <div style="font-weight:900">${yy}年${mm}月</div>
          <button class="btn-ghost btn-small" data-act="cal-next" ${Cal.month >= curMonth ? "disabled" : ""} aria-label="次の月">›</button>
        </div>
        <div style="margin-top:12px" class="calgrid">
          ${WEEKDAYS.map(w => `<div class="calhead">${w}</div>`).join("")}
          ${cells.join("")}
        </div>
        <div class="btns">
          <button class="btn-ghost btn-small btn-wide" data-act="cal-today">今日にもどる</button>
        </div>
      </div>
      ${selDay
        ? renderDayDetail(st, selDay, byDay.get(selDay), byId)
        : `<div class="card"><div class="hint">日付をえらぶと、その日のコーデを確認・記録できます。</div></div>`}
    `;
  }

  function renderDayDetail(st, day, entry, byId){
    const [y, m, d] = day.split("-").map(Number);
    const title = `${m}月${d}日（${WEEKDAYS[new Date(y, m - 1, d).getDay()]}）`;

    // 記録あり・閲覧モード
    if (entry && !Cal.edit) {
      const o = entry.outerId ? byId.get(entry.outerId) : null;
      return `
        <div class="card" data-day="${day}">
          <div class="row">
            <div style="font-weight:900; font-size:15px">${escapeHtml(title)}</div>
            <span class="badge on">記録あり</span>
          </div>
          <div style="margin-top:10px" class="stack">
            ${renderHistoryLine("トップス", byId.get(entry.topsId), false)}
            ${renderHistoryLine("ボトムス", byId.get(entry.bottomsId), false)}
            ${renderHistoryLine("アウター", o, true)}
          </div>
          <div class="btns">
            <button class="btn-ghost btn-wide" data-act="cal-edit">この日の記録を変更</button>
          </div>
          <div class="btns">
            <button class="btn-danger btn-wide" data-act="cal-del">この日の記録を削除</button>
          </div>
        </div>
      `;
    }

    // 記録なし／変更中：選んで保存するフォーム
    const optionsFor = (cat, selectedId) => st.wardrobe
      .filter(x => x.category === cat)
      .sort((a, b) => a.createdAt - b.createdAt)
      .map(it => `<option value="${escapeHtml(it.id)}" ${it.id === selectedId ? "selected" : ""}>${escapeHtml(it.name)} (${escapeHtml(it.color)})${it.enabled ? "" : "（無効）"}</option>`)
      .join("");

    return `
      <div class="card" data-day="${day}">
        <div class="row">
          <div style="font-weight:900; font-size:15px">${escapeHtml(title)}</div>
          <span class="badge">${entry ? "変更中" : "記録なし"}</span>
        </div>
        <div class="hint" style="margin-top:6px">${entry ? "この日に着たコーデを変更できます。" : "この日に着たコーデを記録できます。"}</div>
        <div class="stack" style="margin-top:10px">
          <div class="field">
            <label for="cal-tops">トップス</label>
            <select id="cal-tops"><option value="">えらんでください</option>${optionsFor("tops", entry && entry.topsId)}</select>
          </div>
          <div class="field">
            <label for="cal-bottoms">ボトムス</label>
            <select id="cal-bottoms"><option value="">えらんでください</option>${optionsFor("bottoms", entry && entry.bottomsId)}</select>
          </div>
          <div class="field">
            <label for="cal-outer">アウター</label>
            <select id="cal-outer"><option value="none">なし</option>${optionsFor("outer", entry && entry.outerId)}</select>
          </div>
        </div>
        <div class="btns">
          <button class="btn-primary btn-wide" data-act="cal-save">${entry ? "変更を保存" : "記録する"}</button>
        </div>
        ${entry ? `<div class="btns"><button class="btn-ghost btn-wide" data-act="cal-cancel">キャンセル</button></div>` : ""}
      </div>
    `;
  }

  /* 着用回数：期間別の回数と「しばらく着ていない服」 */
  function renderStatsBody(st){
    const range = st.ui.statsRange;
    const rangeLabel = { "30": "直近30日", "90": "直近90日", "all": "全期間" }[range];

    // 集計の起点（range 日前の日付キー。all は無制限）
    let sinceKey = "";
    if (range !== "all") {
      const d = new Date();
      d.setDate(d.getDate() - (Number(range) - 1));
      sinceKey = dayKey(d.getTime());
    }

    const counts = new Map();   // id → 期間内の回数
    const last = new Map();     // id → 最後に着た日時（全期間）
    const days = new Set();
    let outerNone = 0;
    for (const h of st.history) {
      const ids = [h.topsId, h.bottomsId, h.outerId].filter(Boolean);
      for (const id of ids) {
        const prev = last.get(id);
        if (prev === undefined || h.at > prev) last.set(id, h.at);
      }
      const k = dayKey(h.at);
      if (sinceKey && k < sinceKey) continue;
      days.add(k);
      for (const id of ids) counts.set(id, (counts.get(id) || 0) + 1);
      if (!h.outerId) outerNone++;
    }

    const rangeTabs = [["30", "30日"], ["90", "90日"], ["all", "全期間"]];
    const rangeCard = `
      <div class="card">
        <div class="tabs" role="tablist">
          ${rangeTabs.map(([k, label]) => `
            <button class="tab ${k === range ? "active" : ""}" data-act="stats-range" data-range="${k}" role="tab" aria-selected="${k === range}">${label}</button>
          `).join("")}
        </div>
        <div class="hint" style="margin-top:10px">${rangeLabel}の記録：${days.size} 日分</div>
      </div>
    `;

    if (st.history.length === 0) {
      return rangeCard + `<div class="card"><div class="hint">まだ記録がありません。ホームで「採用」するか、カレンダーから記録すると、ここに集計されます。</div></div>`;
    }

    // しばらく着ていない服（有効なもの。未着用が先、次に最後に着た日が古い順）
    const idle = idleItems(st, 5, 0).map(x => x.it);

    const idleCard = `
      <div class="card">
        <div style="font-weight:900">しばらく着ていない服</div>
        <div class="hint">有効な服のうち、最後に着てから日がたっている順です。</div>
        <div class="divider"></div>
        <div class="stack">
          ${idle.length === 0
            ? `<div class="hint">有効な服がありません。</div>`
            : idle.map(it => {
                const lt = last.get(it.id);
                return `
                  <div class="row">
                    <div class="left">
                      ${thumbHtml(it)}
                      <div class="v">
                        <div class="name">${escapeHtml(it.name)}</div>
                        <div class="meta">${escapeHtml(catLabel(it.category))} / ${escapeHtml(it.color)}</div>
                      </div>
                    </div>
                    <span class="badge ${lt === undefined ? "off" : ""}">${escapeHtml(agoLabel(lt))}</span>
                  </div>
                `;
              }).join("")}
        </div>
      </div>
    `;

    // カテゴリ別の着用回数（多い順）
    const catCards = CATS.map(c => {
      const items = st.wardrobe
        .filter(x => x.category === c.key)
        .sort((a, b) => (counts.get(b.id) || 0) - (counts.get(a.id) || 0) || a.name.localeCompare(b.name, "ja"));
      const max = Math.max(1, ...items.map(x => counts.get(x.id) || 0));
      return `
        <div class="card">
          <div style="font-weight:900">${escapeHtml(c.label)}</div>
          <div class="hint">${rangeLabel}の着用回数</div>
          <div class="divider"></div>
          <div class="stack">
            ${items.length === 0
              ? `<div class="hint">まだありません。</div>`
              : items.map(it => {
                  const n = counts.get(it.id) || 0;
                  return `
                    <div>
                      <div class="row">
                        <div class="left">
                          ${thumbHtml(it)}
                          <div class="v">
                            <div class="name">${escapeHtml(it.name)}${it.enabled ? "" : "（無効）"}</div>
                            <div class="meta">最終着用：${escapeHtml(agoLabel(last.get(it.id)))}</div>
                          </div>
                        </div>
                        <span class="badge">${n}回</span>
                      </div>
                      <div class="bar"><i style="width:${Math.round(n / max * 100)}%"></i></div>
                    </div>
                  `;
                }).join("")}
            ${c.key === "outer" ? `<div class="hint">アウターなし：${outerNone}回</div>` : ""}
          </div>
        </div>
      `;
    }).join("");

    return rangeCard + idleCard + catCards;
  }

  function renderHistoryLine(label, item, allowNone){
    if (!item) {

/* =========================
   モーダル・確認ダイアログ
   ========================= */
const Modal = (() => {
  let activeBackdrop = null;
  let activeCard = null;
  let escHandler = null;
  let previousFocus = null;

  function isOpen(){ return activeCard !== null; }

  function open({ cardHtml, onClose }){
    if (isOpen()) return false; // 二重オープン防止

    previousFocus = document.activeElement;

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const card = document.createElement("div");
    card.className = "card modal-card";
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-modal", "true");
    card.innerHTML = cardHtml;

    document.body.appendChild(backdrop);
    document.body.appendChild(card);
    document.body.style.overflow = "hidden";

    activeBackdrop = backdrop;
    activeCard = card;

    const doClose = () => close(onClose);
    backdrop.addEventListener("click", doClose);

    escHandler = (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        doClose();
      }
    };
    document.addEventListener("keydown", escHandler);

    // 最初の入力にフォーカス
    const firstInput = card.querySelector("input, select, textarea, button");
    if (firstInput) firstInput.focus();

    return true;
  }

  function close(onCloseCb){
    if (!isOpen()) return;
    if (escHandler) {
      document.removeEventListener("keydown", escHandler);
      escHandler = null;
    }
    activeBackdrop?.remove();
    activeCard?.remove();
    activeBackdrop = null;
    activeCard = null;
    document.body.style.overflow = "";
    if (previousFocus && typeof previousFocus.focus === "function") {
      previousFocus.focus();
    }
    previousFocus = null;
    if (typeof onCloseCb === "function") onCloseCb();
  }

  function getCard(){ return activeCard; }

  /**
   * 確認ダイアログ（confirm代替）
   */
  function confirm(message){
    return new Promise((resolve) => {
      if (isOpen()) { resolve(false); return; }

      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      const card = document.createElement("div");
      card.className = "card confirm-card";
      card.setAttribute("role", "alertdialog");
      card.setAttribute("aria-modal", "true");
      card.innerHTML = `
        <div style="font-weight:800; font-size:15px; line-height:1.5">${escapeHtml(message)}</div>
        <div class="btns">
          <button class="btn-ghost btn-wide" data-confirm-act="cancel">キャンセル</button>
          <button class="btn-danger btn-wide" data-confirm-act="ok">OK</button>
        </div>
      `;
      document.body.appendChild(backdrop);
      document.body.appendChild(card);
      document.body.style.overflow = "hidden";
      activeBackdrop = backdrop;
      activeCard = card;

      const cleanup = (result) => {
        document.removeEventListener("keydown", keyHandler);
        backdrop.remove();
        card.remove();
        activeBackdrop = null;
        activeCard = null;
        document.body.style.overflow = "";
        resolve(result);
      };
      const keyHandler = (e) => {
        if (e.key === "Escape") { e.preventDefault(); cleanup(false); }
      };
      document.addEventListener("keydown", keyHandler);
      backdrop.addEventListener("click", () => cleanup(false));
      card.addEventListener("click", (e) => {
        const act = e.target.closest("[data-confirm-act]")?.dataset.confirmAct;
        if (act === "ok") cleanup(true);
        else if (act === "cancel") cleanup(false);
      });
      card.querySelector('[data-confirm-act="ok"]')?.focus();
    });
  }

  return { open, close, isOpen, getCard, confirm };
})();

    if (act === "use-idle") {

      const key = { tops: "topsId", bottoms: "bottomsId", outer: "outerId" }[it.category];

    }
    if (act === "resuggest") {
      st.ui.cands = []; // 全候補を引き直す
      UI.renderCurrent();
      return;
    }
    if (act === "unadopt") {
      const todayK = dayKey(Date.now());
      st.history = st.history.filter(h => dayKey(h.at) !== todayK);
      Store.save();
      UI.toast("今日の採用を取り消しました");
      UI.renderCurrent();
      return;
    }
    if (act === "clear-excluded") {
      st.ui.excluded = [];
      Store.save();
      UI.toast("除外をクリアしました");
      UI.renderCurrent();
      return;
    }
    if (act === "adopt" || act === "exclude") {
      const card = target.closest("[data-key]");
      if (!card) return;
      const k = card.dataset.key;
      const suggestions = UI.getCurrentSuggestions();
      const o = suggestions.find(x => Suggest.outfitKey(x) === k);
      if (!o) return;

      if (act === "adopt") {
        // 1日1件：今日の既存エントリは置き換える（連打・複数回採用でも履歴は増えない）
        const todayK = dayKey(Date.now());
        const had = todaysEntry(st.history);
        if (had) {
          const sameOutfit = had.topsId === o.tops.id
            && had.bottomsId === o.bottoms.id
            && (had.outerId || null) === (o.outer ? o.outer.id : null);

        Store.save();

        UI.renderCurrent();
      });

    // タブ・集計期間

      UI.renderCurrent();

    // カレンダー：月移動・日付選択

      if (act === "cal-next" && Cal.month >= todayK.slice(0, 7)) return;   // 未来の月へは進まない
      Cal.month = shiftMonth(Cal.month, act === "cal-prev" ? -1 : 1);
      Cal.day = "";
      Cal.edit = false;
      UI.renderCurrent();
      return;

    if (act === "cal-today") {
      Cal.month = todayK.slice(0, 7);
      Cal.day = todayK;
      Cal.edit = false;
      UI.renderCurrent();
      return;
    }
    if (act === "cal-day") {
      const d = target?.dataset.day;
      if (!d || d > todayK) return;
      Cal.day = d;
      Cal.edit = false;
      UI.renderCurrent();
      return;

      return;

    // カレンダー：選択した日の記録を保存・削除

      const root = document.getElementById("view-history");
      const topsId    = root.querySelector("#cal-tops")?.value || "";

        return;

      const had = st.history.some(h => dayKey(h.at) === day);

      st.history.push({

        at: atForDay(day),
        topsId,
        bottomsId,
        outerId: outerSel === "none" ? null : outerSel,

  /* ---- WEATHER ---- */

  async function applyLocation(loc){

    UI.refreshWeatherStatus();   // 「取得中…」と新しい地域名を先に表示

    UI.refreshWeatherStatus();

  async function handleWeather(act, target){
    if (act === "wx-refresh") {
      if (!Weather.isEnabled()) { UI.toast("天気連動がオフです"); return; }

    if (typeof act === "string" && act.startsWith("wx-")) {
      handleWeather(act, target);

    }
    if (act === "export") {
      const st = Store.get();

      const payload = { ...st, photos: PhotoStore.exportAll(new Set(st.wardrobe.map(x => x.id))) };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `zennosuke_outfit_backup_${new Date().toISOString().slice(0, 10)}.json`;

          UI.toast("リセットに失敗しました");

  async function handleFileImport(file){
    if (!file) return;
    try {
      const txt = await file.text();
      const obj = JSON.parse(txt);
      const normalized = Store.validate(obj);
      const r = Store.replace(normalized);
      if (!r.ok) {
        UI.toast(r.reason === "quota" ? "保存容量が上限に達しました" : "保存に失敗しました");
        return;
      }
      // 写真：バックアップ内の有効なJPEGだけを受け入れ、存在しない服の写真は捨てる
      const ids = new Set(normalized.wardrobe.map(x => x.id));
      const incoming = {};
      if (obj.photos && typeof obj.photos === "object" && !Array.isArray(obj.photos)) {
        for (const [id, url] of Object.entries(obj.photos)) {
          if (ids.has(id) && PhotoStore.validDataUrl(url)) incoming[id] = url;
        }
      }
      await PhotoStore.syncTo(ids, incoming);
      UI.toast("インポートしました");
      UI.renderCurrent();
    } catch {
      UI.toast("インポートに失敗しました");
    }
  }

  return {
    handleHome,
    handleHomeChange,
    handleWardrobe,
    handleHistory,
    handleSettings,
    handleWeatherChange,
    handleFileImport,
    handlePhotoFile,
    openPhotoViewer,
  };
})();

/* =========================
   イベント委譲（ルート1箇所で全アクションを拾う）
   ========================= */
function bindDelegatedEvents(){
  // クリック：ビューごとに振り分け
  document.body.addEventListener("click", (e) => {
    const actEl = e.target.closest("[data-act]");
    if (!actEl) return;
    const act = actEl.dataset.act;

    // どのビュー内か判定
    if (document.getElementById("view-home").contains(actEl))      { Actions.handleHome(act, actEl); return; }
    if (document.getElementById("view-wardrobe").contains(actEl))  { Actions.handleWardrobe(act, actEl); return; }
    if (document.getElementById("view-history").contains(actEl))   { Actions.handleHistory(act, actEl); return; }
    if (document.getElementById("view-settings").contains(actEl))  { Actions.handleSettings(act, actEl); return; }
  });

  // サムネイルをタップして写真を拡大
  document.body.addEventListener("click", (e) => {
    const el = e.target.closest("[data-photo-view]");
    if (!el || Modal.isOpen()) return;
    Actions.openPhotoViewer(el.dataset.photoView);
  });

  // キーボード：地名検索は Enter、role=button の写真枠は Enter/Space で操作
  document.body.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target && e.target.id === "wx-q") {
      e.preventDefault();
      Actions.handleSettings("wx-search", e.target);
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.matches
        && e.target.matches('[role="button"][data-act]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  // change：ロック select・ワードローブタブ・ファイル選択
  document.body.addEventListener("change", (e) => {
    const homeRoot = document.getElementById("view-home");
    if (homeRoot.contains(e.target) && e.target.matches("select[data-lock]")) {
      Actions.handleHomeChange(e.target);
      return;
    }
    if (e.target.id === "wx-enabled" || e.target.id === "wx-preset") {
      Actions.handleWeatherChange(e.target);
      return;
    }
    if (e.target.id === "import-file") {
      const f = e.target.files && e.target.files[0];
      Actions.handleFileImport(f);
      e.target.value = "";
      return;
    }
    if (e.target.id === "photo-file") {
      const f = e.target.files && e.target.files[0];
      Actions.handlePhotoFile(f);
    }
  });

  // ワードローブタブは button なので click でも拾える
  document.body.addEventListener("click", (e) => {
    const tabBtn = e.target.closest("#wardrobe-tabs [data-tab]");
    if (!tabBtn) return;
    Actions.handleWardrobe(null, tabBtn);
  });

  // ナビ
  document.querySelectorAll(".nav a").forEach(a => {
    a.addEventListener("click", (e) => {
      const name = a.dataset.nav;
      if (!name) return;
      const st = Store.get();
      st.ui.currentView = name;
      Store.save();
      UI.renderCurrent();
      window.scrollTo(0, 0);   // 画面を切り替えたら先頭から表示
      // hashchange 発火は許容（hrefそのまま）
    });
  });

  // アプリを開いたまま日付をまたいだ場合、復帰時に「今日」を更新する
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (Modal.isOpen()) return;
    Weather.refresh();   // 日付が変わっていれば今日の天気を取得（新しいキャッシュがあれば何もしない）
    if (Store.rollover()) {
      Store.save();
      UI.renderCurrent();
    }
  });

  // hashchange
  window.addEventListener("hashchange", () => {
    const hash = (location.hash || "#home").replace("#", "");
    if (["home","wardrobe","history","settings"].includes(hash)) {
      const st = Store.get();
      st.ui.currentView = hash;
      Store.save();
      UI.renderCurrent();
    }
  });
}

/* =========================
   起動
   ========================= */
(function boot(){
  Store.init();
  UI.init();
  bindDelegatedEvents();

  // 天気の取得が終わったら画面に反映（入力中の設定フォームは壊さない）
  Weather.onChange(() => {
    if (Modal.isOpen()) return;
    const view = Store.get().ui.currentView;
    if (view === "home") UI.renderCurrent();
    else if (view === "settings") UI.refreshWeatherStatus();
  });
  Weather.init();   // 今日の予報が未取得なら取得開始（取得中は候補の作成を待つ）

  UI.renderCurrent();

  // 写真は読み込み完了後に反映（1枚でもあればサムネイルつきで再描画）
  PhotoStore.init().then(() => {
    if (PhotoStore.count() > 0 && !Modal.isOpen()) UI.renderCurrent();
  });

  // PWA：オフラインでも開けるように（http(s) のときだけ登録）
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    const hadController = !!navigator.serviceWorker.controller;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController) UI.toast("アプリを更新しました。再読み込みで反映されます");
    });
  }
})();
</script>
</body>
</html>
